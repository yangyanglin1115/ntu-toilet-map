<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>臺大廁所地圖 — 管理後台</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --navy: #0f172a;
    --primary: #0d9488;
    --violet: #7c3aed;
    --amber: #d97706;
    --red: #dc2626;
    --border: #e2e8f0;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: var(--bg); color: #1e293b; min-height: 100vh;
  }
  /* Login Screen */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
  }
  .login-card {
    background: #fff; width: 100%; max-width: 390px; border-radius: 18px;
    padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .login-card h1 { margin: 0 0 6px; font-size: 20px; color: var(--navy); }
  .login-card p { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .input-el {
    width: 100%; padding: 11px 13px; border: 1.5px solid #cbd5e1; border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  .input-el:focus { border-color: var(--primary); }
  .btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: 13.5px;
    font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { filter: brightness(0.95); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ghost { background: #e2e8f0; color: #334155; }
  .btn-outline { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* App Shell */
  .app { display: none; }
  .topbar {
    background: var(--navy); color: #fff; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 10px rgba(15,23,42,0.2);
  }
  .topbar-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .top-link {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 700;
    cursor: pointer; text-decoration: none;
  }
  .top-link:hover { background: rgba(255,255,255,0.2); }

  .container { max-width: 1020px; margin: 0 auto; padding: 18px 14px 60px; }

  /* Upgrade Notice Banner */
  .warn-banner {
    display: none; background: #fef3c7; border: 1px solid #f59e0b; color: #92400e;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.55; margin-bottom: 16px;
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; box-shadow: 0 1px 4px rgba(15,23,42,0.04);
  }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi-val { font-size: 26px; font-weight: 900; margin-top: 4px; color: var(--navy); }
  .kpi.alert .kpi-val { color: var(--red); }
  .kpi.good .kpi-val { color: var(--primary); }

  /* Tabs */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px;
  }
  .tab-btn {
    border: 1px solid #cbd5e1; background: #fff; color: #334155;
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .tab-count {
    background: #e2e8f0; color: #334155; border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 800;
  }
  .tab-btn.active .tab-count { background: rgba(255,255,255,0.22); color: #fff; }
  .tab-count.red { background: #fee2e2; color: #dc2626; }

  /* Filter Toolbar */
  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .toolbar input { flex: 1; min-width: 180px; padding: 8px 12px; font-size: 13px; }
  .toolbar select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 13px; background: #fff; }

  /* Item Cards */
  .item-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(15,23,42,0.04);
  }
  .item-card.pending { border-left: 4px solid #f59e0b; background: #fffdf5; }
  .item-card.rejected { border-left: 4px solid #dc2626; opacity: 0.78; }
  .item-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .item-title { font-size: 15px; font-weight: 800; color: var(--navy); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800;
  }
  .b-pending { background: #fef3c7; color: #b45309; }
  .b-approved { background: #dcfce7; color: #15803d; }
  .b-rejected { background: #fee2e2; color: #b91c1c; }
  .b-floor { background: #e0f2fe; color: #0369a1; }
  .item-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .item-reason {
    background: #fef3c7; color: #92400e; padding: 6px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 700; margin-bottom: 8px;
  }
  .item-comment { font-size: 13.5px; color: #1e293b; line-height: 1.55; margin-bottom: 8px; white-space: pre-wrap; }
  .item-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .tag-pill { background: #f1f5f9; color: #334155; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .item-photo {
    max-width: 260px; max-height: 190px; border-radius: 10px; border: 1px solid var(--border);
    cursor: zoom-in; display: block; margin-bottom: 10px; object-fit: cover;
  }
  .item-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid #f1f5f9; }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px;
    background: #fff; border-radius: 14px; border: 1px dashed #cbd5e1;
  }
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 999; background: rgba(15,23,42,0.88);
    align-items: center; justify-content: center; padding: 16px; cursor: zoom-out;
  }
  #lightbox img { max-width: 95vw; max-height: 92vh; border-radius: 10px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="login-card">
    <h1>🛠️ 臺大廁所地圖管理後台</h1>
    <p>獨立審核網站，可即時預覽待審照片、一鍵核准或下架評論、管理新增點位與查看網站回饋。</p>
    <input type="password" id="keyInput" class="input-el" placeholder="請輸入管理密碼" onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="btn btn-primary" style="width:100%;margin-top:12px;" id="loginBtn" onclick="doLogin()">登入管理後台</button>
    <div id="loginErr" style="color:#dc2626;font-size:12.5px;margin-top:10px;font-weight:700;"></div>
    <div style="margin-top:16px;text-align:center;">
      <a href="https://yangyanglin1115.github.io/ntu-toilet-map/" style="font-size:12.5px;color:#64748b;">← 返回公開地圖網站</a>
    </div>
  </div>
</div>

<div class="app" id="appView">
  <div class="topbar">
    <div class="topbar-title">🛠️ 臺大廁所地圖｜管理後台</div>
    <div class="topbar-actions">
      <button class="top-link" onclick="loadData()">🔄 重新整理</button>
      <a class="top-link" href="https://docs.google.com/spreadsheets/d/1a3vuyoxjEAfc6_HLqQGA3_Ezj7qWsBFI3X0VGRgPpPM/edit" target="_blank">📊 Google Sheets</a>
      <a class="top-link" href="https://yangyanglin1115.github.io/ntu-toilet-map/" target="_blank">🗺️ 公開地圖</a>
      <button class="top-link" onclick="logout()">🚪 登出</button>
    </div>
  </div>

  <div class="container">
    <div class="warn-banner" id="v4WarnBanner"></div>

    <div class="kpi-grid">
      <div class="kpi alert"><div class="kpi-label">🔔 待審核項目</div><div class="kpi-val" id="kPending">0</div></div>
      <div class="kpi good"><div class="kpi-label">✅ 已公開評論</div><div class="kpi-val" id="kApproved">0</div></div>
      <div class="kpi"><div class="kpi-label">📷 含照片評論</div><div class="kpi-val" id="kPhotos">0</div></div>
      <div class="kpi"><div class="kpi-label">📍 使用者新增點位</div><div class="kpi-val" id="kPoints">0</div></div>
      <div class="kpi"><div class="kpi-label">📮 網站回饋</div><div class="kpi-val" id="kFeedback">0</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">🔔 待審核 <span class="tab-count red" id="cPending">0</span></button>
      <button class="tab-btn" data-tab="reviews" onclick="switchTab('reviews')">💬 全部評論 <span class="tab-count" id="cReviews">0</span></button>
      <button class="tab-btn" data-tab="points" onclick="switchTab('points')">📍 新增點位 <span class="tab-count" id="cPoints">0</span></button>
      <button class="tab-btn" data-tab="feedback" onclick="switchTab('feedback')">📮 網站回饋 <span class="tab-count" id="cFeedback">0</span></button>
    </div>

    <div class="toolbar" id="searchToolbar" style="display:none;">
      <input type="text" id="qInput" class="input-el" placeholder="搜尋館名、留言內容、投稿者、標籤..." oninput="renderList()" />
      <select id="statusFilter" onchange="renderList()">
        <option value="ALL">全部狀態</option>
        <option value="APPROVED">僅已公開</option>
        <option value="PENDING">僅待審核</option>
        <option value="REJECTED">僅已下架</option>
        <option value="PHOTO">僅含照片</option>
      </select>
    </div>

    <div id="listArea"></div>
  </div>
</div>

<div id="lightbox" onclick="this.style.display='none'"><img id="lbImg" src="" alt="預覽放大" /></div>
<div id="toast"></div>

const PUBLIC_MAP_URL = "https://yangyanglin1115.github.io/ntu-toilet-map/";
const LS_KEY = "ntu_toilet_admin_key_v1";

let adminKey = localStorage.getItem(LS_KEY) || "";
let currentTab = "pending";
let allReviews = [];
let allPoints = [];
let isReadOnlyFallback = false;

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

function formatTime(t) {
  const s = String(t || "").trim();
  if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return s;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = "none", 2600);
}

function openLb(src) {
  document.getElementById("lbImg").src = src;
  document.getElementById("lightbox").style.display = "flex";
}

function doLogin() {
  const val = document.getElementById("keyInput").value.trim();
  if (!val) { document.getElementById("loginErr").textContent = "請輸入管理密碼"; return; }
  adminKey = val;
  document.getElementById("loginBtn").disabled = true;
  document.getElementById("loginErr").textContent = "驗證中...";
  loadData(true);
}

function logout() {
  localStorage.removeItem(LS_KEY);
  adminKey = "";
  document.getElementById("appView").style.display = "none";
  document.getElementById("loginView").style.display = "flex";
  document.getElementById("keyInput").value = "";
  document.getElementById("loginErr").textContent = "";
}

async function loadData(fromLogin = false) {
  try {
    const resp = await fetch(`${API_URL}?action=adminData&key=${encodeURIComponent(adminKey)}&_t=${Date.now()}`);
    const data = await resp.json();
    if (!data.ok) {
      document.getElementById("loginBtn").disabled = false;
      document.getElementById("loginErr").textContent = data.error || "密碼錯誤或無法驗證";
      return;
    }
    // 判斷是否為 v4（含有 version: "v4"）或尚未升級的 v3 公開格式
    if (data.version === "v4") {
      isReadOnlyFallback = false;
      allReviews = data.reviews || [];
      allPoints = data.points || [];
      document.getElementById("v4WarnBanner").style.display = "none";
    } else {
      // 尚未把 Apps Script 更新至 v4 時，先降級顯示公開資料並提示更新步驟
      isReadOnlyFallback = true;
      allReviews = [];
      Object.entries(data.reviews || {}).forEach(([fid, arr]) => {
        arr.forEach((r, idx) => allReviews.push(Object.assign({ row: 0, feature_id: fid, status: "APPROVED", flag_reason: "" }, r)));
      });
      allPoints = (data.points || []).map(f => Object.assign({
        row: 0, status: "APPROVED", flag_reason: "",
        lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]
      }, f.properties));
      const b = document.getElementById("v4WarnBanner");
      b.innerHTML = "⚠️ <b>提示：</b>目前雲端 Apps Script 仍為 v3 版本（僅能檢視已公開資料）。請將 <code>google_apps_script_backend.js (v4)</code> 貼上 Apps Script 並發佈新版本，即可啟用「預覽待審照片＋一鍵核准／下架／刪除」完整後台功能！";
      b.style.display = "block";
    }

    localStorage.setItem(LS_KEY, adminKey);
    document.getElementById("loginView").style.display = "none";
    document.getElementById("appView").style.display = "block";
    document.getElementById("loginBtn").disabled = false;
    updateKPIs();
    renderList();
    if (!fromLogin) showToast("已更新最新雲端資料");
  } catch (err) {
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginErr").textContent = "連線雲端失敗，請稍後再試";
    showToast("讀取資料失敗");
  }
}

function updateKPIs() {
  const normalRevs = allReviews.filter(r => r.feature_id !== "__SITE_FEEDBACK__");
  const feedbacks  = allReviews.filter(r => r.feature_id === "__SITE_FEEDBACK__");
  const pendingRevs = normalRevs.filter(r => r.status === "PENDING");
  const pendingPts  = allPoints.filter(p => p.status === "PENDING");
  const pendingTotal = pendingRevs.length + pendingPts.length;

  document.getElementById("kPending").textContent = pendingTotal;
  document.getElementById("kApproved").textContent = normalRevs.filter(r => r.status === "APPROVED").length;
  document.getElementById("kPhotos").textContent = normalRevs.filter(r => r.photo_url).length;
  document.getElementById("kPoints").textContent = allPoints.length;
  document.getElementById("kFeedback").textContent = feedbacks.length;

  document.getElementById("cPending").textContent = pendingTotal;
  document.getElementById("cReviews").textContent = normalRevs.length;
  document.getElementById("cPoints").textContent = allPoints.length;
  document.getElementById("cFeedback").textContent = feedbacks.length;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("searchToolbar").style.display = (tab === "reviews") ? "flex" : "none";
  renderList();
}

async function moderateRow(sheet, row, decision) {
  if (isReadOnlyFallback) { showToast("請先將 Apps Script 升級至 v4"); return; }
  if (decision === "DELETE" && !confirm("確定要永久刪除這筆資料（含雲端照片）嗎？此動作無法復原。")) return;
  showToast("正在更新雲端狀態...");
  try {
    const url = `${API_URL}?action=adminModerate&key=${encodeURIComponent(adminKey)}&sheet=${encodeURIComponent(sheet)}&row=${row}&decision=${decision}&_t=${Date.now()}`;
    const resp = await fetch(url);
    const res = await resp.json();
    if (!res.ok) { showToast("操作失敗：" + (res.error || "未知錯誤")); return; }
    showToast(decision === "APPROVED" ? "✅ 已核准公開！" : (decision === "REJECTED" ? "❌ 已下架隱藏" : "🗑️ 已永久刪除"));
    loadData(true);
  } catch (e) {
    showToast("連線錯誤，請重試");
  }
}

function statusBadge(st) {
  if (st === "PENDING") return '<span class="badge b-pending">待審核</span>';
  if (st === "REJECTED") return '<span class="badge b-rejected">已下架</span>';
  return '<span class="badge b-approved">已公開</span>';
}

function renderReviewCard(r) {
  const placeName = r.feature_id === "__SITE_FEEDBACK__" ? "📮 網站意見回饋" : (NAME_MAP[r.feature_id] || r.feature_id);
  const avg = (((+r.clean) + (+r.vent) + (+r.equip)) / 3).toFixed(1);
  const cardCls = r.status === "PENDING" ? "pending" : (r.status === "REJECTED" ? "rejected" : "");
  const actionsHtml = !isReadOnlyFallback && r.row ? `
    <div class="item-actions">
      ${r.status !== "APPROVED" ? `<button class="btn btn-primary btn-sm" onclick="moderateRow('Reviews', ${r.row}, 'APPROVED')">✅ 核准公開</button>` : ""}
      ${r.status !== "REJECTED" ? `<button class="btn btn-outline btn-sm" onclick="moderateRow('Reviews', ${r.row}, 'REJECTED')">🚫 下架隱藏</button>` : ""}
      <button class="btn btn-danger btn-sm" onclick="moderateRow('Reviews', ${r.row}, 'DELETE')">🗑️ 永久刪除</button>
    </div>` : "";
  return `
    <div class="item-card ${cardCls}">
      <div class="item-head">
        <div>
          <div class="item-title">${escapeHtml(placeName)}</div>
          <div class="item-meta">
            投稿者：<b>${escapeHtml(r.author)}</b>
            ${r.feature_id !== "__SITE_FEEDBACK__" ? `｜★ ${avg}（整潔${r.clean} / 通風${r.vent} / 設備${r.equip}）` : ""}
            ｜${escapeHtml(formatTime(r.time))}
          </div>
        </div>
        <div style="display:flex;gap:5px;align-items:center;">
          <span class="badge b-floor">${escapeHtml(r.floor)}</span>
          ${statusBadge(r.status)}
        </div>
      </div>
      ${r.flag_reason ? `<div class="item-reason">⚠️ 攔截原因：${escapeHtml(r.flag_reason)}</div>` : ""}
      <div class="item-comment">${escapeHtml(r.comment || "（無文字留言）")}</div>
      ${(r.tags && r.tags.length) ? `<div class="item-tags">${r.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
      ${r.photo_url ? `<img class="item-photo" src="${escapeHtml(r.photo_url)}" onclick="openLb(this.src)" alt="投稿照片" />` : ""}
      ${actionsHtml}
    </div>
  `;
}

function renderPointCard(p) {
  const cardCls = p.status === "PENDING" ? "pending" : (p.status === "REJECTED" ? "rejected" : "");
  const actionsHtml = !isReadOnlyFallback && p.row ? `
    <div class="item-actions">
      ${p.status !== "APPROVED" ? `<button class="btn btn-primary btn-sm" onclick="moderateRow('NewPoints', ${p.row}, 'APPROVED')">✅ 核准上線</button>` : ""}
      ${p.status !== "REJECTED" ? `<button class="btn btn-outline btn-sm" onclick="moderateRow('NewPoints', ${p.row}, 'REJECTED')">🚫 下架隱藏</button>` : ""}
      <button class="btn btn-danger btn-sm" onclick="moderateRow('NewPoints', ${p.row}, 'DELETE')">🗑️ 永久刪除</button>
      <a class="btn btn-ghost btn-sm" href="${PUBLIC_MAP_URL}?id=${encodeURIComponent(p.feature_id)}" target="_blank">🗺️ 地圖檢視</a>
    </div>` : "";
  return `
    <div class="item-card ${cardCls}">
      <div class="item-head">
        <div>
          <div class="item-title">📍 ${escapeHtml(p.name || p.feature_id)}</div>
          <div class="item-meta">分類：${escapeHtml(p.category)}｜樓層：${escapeHtml(p.floor)}｜24H：${escapeHtml(p.is_24h)}｜WGS84: ${Number(p.lat).toFixed(5)}, ${Number(p.lon).toFixed(5)}｜${escapeHtml(formatTime(p.time))}</div>
        </div>
        ${statusBadge(p.status)}
      </div>
      ${p.flag_reason ? `<div class="item-reason">⚠️ 攔截原因：${escapeHtml(p.flag_reason)}</div>` : ""}
      <div class="item-comment">${escapeHtml(p.description || "（無補充說明）")}</div>
      ${p.photo_url ? `<img class="item-photo" src="${escapeHtml(p.photo_url)}" onclick="openLb(this.src)" alt="點位照片" />` : ""}
      ${actionsHtml}
    </div>
  `;
}

function renderList() {
  const area = document.getElementById("listArea");
  const normalRevs = allReviews.filter(r => r.feature_id !== "__SITE_FEEDBACK__").slice().reverse();
  const feedbacks  = allReviews.filter(r => r.feature_id === "__SITE_FEEDBACK__").slice().reverse();
  const pts        = allPoints.slice().reverse();

  if (currentTab === "pending") {
    const pRevs = normalRevs.filter(r => r.status === "PENDING");
    const pPts  = pts.filter(p => p.status === "PENDING");
    if (!pRevs.length && !pPts.length) {
      area.innerHTML = '<div class="empty">🎉 太棒了！目前沒有任何待審核的照片或異常投稿。</div>';
      return;
    }
    area.innerHTML = pPts.map(renderPointCard).join("") + pRevs.map(renderReviewCard).join("");
    return;
  }

  if (currentTab === "reviews") {
    const q = (document.getElementById("qInput").value || "").trim().toLowerCase();
    const sf = document.getElementById("statusFilter").value;
    const filtered = normalRevs.filter(r => {
      if (sf === "PHOTO" && !r.photo_url) return false;
      else if (sf !== "ALL" && sf !== "PHOTO" && r.status !== sf) return false;
      if (q) {
        const hay = `${NAME_MAP[r.feature_id] || ""} ${r.feature_id} ${r.author} ${r.comment} ${(r.tags||[]).join(" ")}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    area.innerHTML = filtered.length ? filtered.map(renderReviewCard).join("") : '<div class="empty">找不到符合條件的評論。</div>';
    return;
  }

  if (currentTab === "points") {
    area.innerHTML = pts.length ? pts.map(renderPointCard).join("") : '<div class="empty">目前尚無使用者新增的廁所點位。</div>';
    return;
  }

  if (currentTab === "feedback") {
    area.innerHTML = feedbacks.length ? feedbacks.map(renderReviewCard).join("") : '<div class="empty">目前尚無網站回饋訊息。</div>';
  }
}

if (adminKey) {
  document.getElementById("keyInput").value = adminKey;
  loadData(true);
}
</script>
</body>
</html>
