<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>臺大廁所參與式地圖｜NTU Restroom PPGIS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --navy: #1e3a5f;
    --blue: #1d4ed8;
    --violet: #7c3aed;
    --teal: #0d9488;
    --amber: #d97706;
    --rose: #e11d48;
    --bg-glass: rgba(255, 255, 255, 0.96);
    --shadow: 0 6px 24px rgba(15, 23, 42, 0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #e2e8f0;
    overflow: hidden;
  }
  #map { width: 100%; height: 100%; }
  #map.add-mode { cursor: crosshair !important; }

  /* Top Floating Search & Quick Chips (Google Maps Mobile Style) */
  .top-bar {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
    z-index: 1000; width: calc(100vw - 20px); max-width: 440px; pointer-events: none;
  }
  .search-wrap {
    pointer-events: auto; width: 100%;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 999px; padding: 6px 10px;
    box-shadow: var(--shadow); border: 1px solid rgba(203, 213, 225, 0.9);
  }
  .brand-dot {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy), var(--violet));
    color: #fff; font-weight: 800; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .search-input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 13.5px; color: #0f172a; min-width: 0; width: 100%; padding: 4px 2px;
  }
  .clear-btn {
    display: none; border: none; background: #e2e8f0; color: #475569;
    width: 22px; height: 22px; border-radius: 50%; font-size: 13px; cursor: pointer;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sync-pill {
    font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; flex-shrink: 0;
  }
  .sync-local { background: #e0f2fe; color: #0369a1; }
  .sync-cloud { background: #dcfce7; color: #15803d; }

  .chips-scroll {
    pointer-events: auto;
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 4px 2px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid rgba(203,213,225,0.9);
    background: var(--bg-glass); color: #1e293b;
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(15,23,42,0.1); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip .c-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Add-Point Instruction Banner */
  .add-banner {
    display: none; position: fixed; top: 104px; left: 50%; transform: translateX(-50%);
    z-index: 1050; background: var(--violet); color: #fff; padding: 9px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 8px 20px rgba(124,58,237,0.35);
  }
  .add-banner button {
    margin-left: 8px; background: rgba(255,255,255,0.25); border: none;
    color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }

  /* Floating GPS Locate Button (Google Maps Style, bottom-right above zoom) */
  .gps-fab {
    position: fixed; right: 12px; bottom: 92px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid rgba(203,213,225,0.95);
    box-shadow: 0 4px 14px rgba(15,23,42,0.2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #334155; transition: transform 0.15s;
  }
  .gps-fab.tracking {
    background: #2563eb; color: #ffffff; border-color: #1d4ed8;
    box-shadow: 0 4px 16px rgba(37,99,235,0.45);
  }
  .gps-fab:active { transform: scale(0.93); }

  /* Pulsing Blue User Location Dot */
  .user-dot-wrap { position: relative; width: 20px; height: 20px; }
  .user-dot-pulse {
    position: absolute; inset: -6px; border-radius: 50%;
    background: rgba(37, 99, 235, 0.28);
    animation: gpsPulse 2s ease-out infinite;
  }
  .user-dot-core {
    position: absolute; inset: 2px; border-radius: 50%;
    background: #2563eb; border: 3px solid #ffffff;
    box-shadow: 0 1px 6px rgba(15,23,42,0.4);
  }
  @keyframes gpsPulse {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  .dist-badge {
    display: inline-block; background: #ccfbf1; color: #0f766e;
    font-size: 11.5px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; margin-top: 4px;
  }

  /* Bottom Navigation / Action Bar (Thumb Zone) */
  .bottom-dock {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; justify-content: center; align-items: center; gap: 6px; padding: 5px 6px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 999px; box-shadow: var(--shadow); border: 1px solid rgba(203,213,225,0.9);
    width: max-content; max-width: calc(100vw - 16px);
  }
  .dock-btn {
    border: none; background: transparent; color: #1e293b;
    padding: 8px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
  }
  .dock-btn.primary { background: var(--teal); color: #fff; }
  .dock-btn.accent  { background: var(--violet); color: #fff; }
  .dock-btn.danger  { background: #dc2626; color: #fff; }
  .dock-btn:active  { transform: scale(0.97); }

  /* Bottom Sheet (Mobile Full-Width Drawer / Desktop Left Card) */
  .sheet-backdrop {
    display: none; position: fixed; inset: 0; z-index: 1190;
    background: rgba(15, 23, 42, 0.28);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200;
    background: #ffffff; border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(15, 23, 42, 0.22);
    max-height: 82vh; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 768px) {
    .sheet {
      left: 14px; right: auto; bottom: 14px; width: 410px;
      border-radius: 16px; max-height: calc(100vh - 120px);
    }
    .sheet-backdrop { background: transparent; pointer-events: none; }
  }
  .sheet-handle {
    width: 40px; height: 4px; background: #cbd5e1; border-radius: 999px;
    margin: 9px auto 4px auto; flex-shrink: 0;
  }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    padding: 4px 16px 10px 16px; border-bottom: 1px solid #e2e8f0;
  }
  .sheet-title { font-size: 17px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .sheet-close {
    border: none; background: #f1f5f9; color: #475569; width: 32px; height: 32px;
    border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .sheet-body {
    padding: 12px 16px 18px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  /* Badges & Summary */
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    color: #fff; font-size: 11.5px; font-weight: 700; margin-right: 4px; margin-top: 4px;
  }
  .badge-24h { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
  .rating-summary {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 10px 12px; margin: 10px 0;
  }
  .rating-big { font-size: 20px; font-weight: 800; color: #d97706; }
  .sub-scores { display: flex; gap: 12px; font-size: 12px; color: #475569; margin-top: 4px; }
  .tag-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tag-pill {
    background: #ede9fe; color: #5b21b6; font-size: 11.5px;
    padding: 3px 9px; border-radius: 999px; font-weight: 600;
  }
  .photo-frame {
    position: relative; width: 100%; margin: 8px 0; border-radius: 10px; overflow: hidden;
    border: 1px solid #cbd5e1;
  }
  .hero-photo {
    width: 100%; max-height: 190px; object-fit: cover;
    cursor: zoom-in; display: block;
  }
  .photo-credit {
    position: absolute; right: 6px; bottom: 6px;
    background: rgba(15, 23, 42, 0.72); color: #f8fafc;
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    backdrop-filter: blur(4px); pointer-events: none; line-height: 1.3;
  }
  .review-photo-frame {
    position: relative; display: inline-block; margin-top: 6px; border-radius: 8px; overflow: hidden;
    border: 1px solid #cbd5e1; max-width: 100%;
  }
  .review-photo {
    max-width: 100%; max-height: 140px; object-fit: cover; display: block; cursor: zoom-in;
  }
  .upload-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px 12px; border: 1.5px dashed #7c3aed; border-radius: 10px;
    background: #f5f3ff; color: #5b21b6; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 6px; text-align: center;
  }
  .upload-btn:active { background: #ede9fe; }
  .upload-preview-wrap {
    display: none; position: relative; margin-top: 8px; border-radius: 10px;
    overflow: hidden; border: 1px solid #cbd5e1; background: #0f172a;
  }
  .upload-preview-wrap img {
    width: 100%; max-height: 160px; object-fit: cover; display: block;
  }
  .upload-remove-btn {
    position: absolute; top: 6px; right: 6px; border: none;
    background: rgba(15,23,42,0.78); color: #fff; width: 26px; height: 26px;
    border-radius: 50%; font-size: 15px; cursor: pointer;
  }
  .meta-line { font-size: 13px; color: #334155; margin: 4px 0; }
  .coord-line { font-family: Consolas, monospace; font-size: 11.5px; color: #0f766e; }

  .cta-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 12px 0; }
  .btn-big {
    width: 100%; padding: 12px 14px; border: none; border-radius: 12px;
    font-size: 14.5px; font-weight: 800; cursor: pointer;
  }
  .btn-rate { background: linear-gradient(135deg, var(--violet), #5b21b6); color: #fff; }
  .btn-nav  { background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe; padding: 12px 14px; text-decoration: none; font-size: 13px; font-weight: 700; border-radius: 12px; display: inline-flex; align-items: center; }
  .btn-sub  { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  /* 5-Second Star Picker & Tag Pills Form */
  .rate-box {
    background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px;
    padding: 12px; margin-top: 8px;
  }
  .star-picker {
    display: flex; justify-content: space-between; gap: 6px; margin: 6px 0 10px 0;
  }
  .star-btn {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid #cbd5e1;
    background: #fff; font-size: 20px; color: #cbd5e1; cursor: pointer;
    transition: transform 0.1s;
  }
  .star-btn.lit { color: #f59e0b; border-color: #fbbf24; background: #fffbeb; }
  .star-btn:active { transform: scale(0.94); }

  .tag-grid { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0 12px 0; }
  .tag-opt {
    padding: 7px 11px; border-radius: 999px; border: 1px solid #cbd5e1;
    background: #fff; font-size: 12.5px; font-weight: 600; color: #334155;
    cursor: pointer; user-select: none;
  }
  .tag-opt.selected { background: var(--violet); color: #fff; border-color: var(--violet); }

  .field-label { font-size: 12px; font-weight: 700; color: #334155; margin: 8px 0 4px 0; display: block; }
  .input-el {
    width: 100%; padding: 10px 11px; border: 1px solid #cbd5e1; border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  .input-el:focus { border-color: var(--violet); }
  .sub-score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }

  /* Review List */
  .review-item { border-top: 1px solid #e2e8f0; padding: 9px 0; }
  .review-head { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
  .review-body { font-size: 13.5px; color: #0f172a; margin-top: 3px; }

  /* Nearby List Item */
  .nearby-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 12px; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 8px; cursor: pointer; background: #fff;
  }
  .nearby-item:active { background: #f1f5f9; }
  .dist-pill {
    background: #ccfbf1; color: #0f766e; font-weight: 800; font-size: 12.5px;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  }

  /* Toast */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2500; background: rgba(15, 23, 42, 0.9); color: #fff;
    padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700;
    display: none; text-align: center; max-width: 85vw;
  }

  /* Lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 2400;
    background: rgba(15, 23, 42, 0.88);
    justify-content: center; align-items: center; padding: 16px; cursor: zoom-out;
  }
  .lightbox-inner { position: relative; max-width: 94vw; max-height: 90vh; }
  #lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 10px; display: block; }
  #lightboxCredit {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(15, 23, 42, 0.78); color: #f8fafc;
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
  }

  .bldg-tip {
    background: rgba(30, 58, 95, 0.9); color: #fff; border: none;
    border-radius: 4px; padding: 2px 6px; font-size: 11px;
  }
  .ntu-label {
    pointer-events: none; white-space: nowrap; text-align: center;
    font-size: 11px; font-weight: 700; color: #1e3a5f;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 4px #fff;
    transform: translate(-50%, -50%);
  }
  .ntu-road-label {
    pointer-events: none; white-space: nowrap; text-align: center;
    font-size: 11.5px; font-weight: 800; color: #0f766e; letter-spacing: 2px;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
    transform: translate(-50%, -50%);
  }
  .leaflet-control-layers { margin-top: 106px !important; }
  @media (min-width: 768px) {
    .leaflet-control-layers { margin-top: 14px !important; }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- Top Floating Search + Horizontal Filter Chips -->
<div class="top-bar">
  <div class="search-wrap">
    <div class="brand-dot">NTU</div>
    <input type="text" id="searchInput" class="search-input" placeholder="搜館舍或標籤（地理系、總圖、免治...）" />
    <button class="clear-btn" id="clearSearchBtn" onclick="clearSearch()">×</button>
    <span id="syncPill" class="sync-pill sync-local">本機模式</span>
  </div>
  <div class="chips-scroll" id="chipsScroll">
    <button class="chip active" data-filter="all" onclick="toggleQuickChip(this, 'all')">全部 (<span id="totalBadge">0</span>)</button>
    <button class="chip" data-filter="cat:公共廁所樞紐" onclick="toggleQuickChip(this, 'cat:公共廁所樞紐')"><span class="c-dot" style="background:#1d4ed8"></span>公共樞紐</button>
    <button class="chip" data-filter="cat:性別友善廁所" onclick="toggleQuickChip(this, 'cat:性別友善廁所')"><span class="c-dot" style="background:#7c3aed"></span>性別友善</button>
    <button class="chip" data-filter="cat:無障礙廁所" onclick="toggleQuickChip(this, 'cat:無障礙廁所')"><span class="c-dot" style="background:#0d9488"></span>無障礙</button>
    <button class="chip" data-filter="bidet" onclick="toggleQuickChip(this, 'bidet')">有免治馬桶</button>
    <button class="chip" data-filter="top" onclick="toggleQuickChip(this, 'top')">4★ 以上好評</button>
    <button class="chip" data-filter="24h" onclick="toggleQuickChip(this, '24h')">24H 開放</button>
    <button class="chip" data-filter="photo" onclick="toggleQuickChip(this, 'photo')">附實景照</button>
    <button class="chip active" id="chipBldg" onclick="toggleBuildings()">建物輪廓</button>
  </div>
</div>

<!-- Add Mode Banner -->
<div class="add-banner" id="addBanner">
  點擊地圖標記位置
  <button onclick="markMyGps()">標記我的位置</button>
  <button onclick="markMapCenter()">畫面中心</button>
  <button onclick="toggleAddMode(false)">取消</button>
</div>

<!-- Google Maps Style Floating GPS Locate Button -->
<button class="gps-fab" id="gpsFab" onclick="toggleGpsTracking()" title="即時 GPS 定位（顯示我的位置）" aria-label="即時 GPS 定位">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
  </svg>
</button>

<!-- Bottom Thumb-Zone Dock -->
<div class="bottom-dock">
  <button class="dock-btn primary" onclick="openNearbySheet()">附近廁所</button>
  <button class="dock-btn accent" id="addDockBtn" onclick="toggleAddMode()">＋ 新增廁所</button>
  <button class="dock-btn" onclick="openToolsSheet()">校區／匯出</button>
</div>

<!-- Universal Bottom Sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheetTitle"></div>
    <button class="sheet-close" onclick="closeSheet()">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'">
  <div class="lightbox-inner">
    <img id="lightboxImg" src="" alt="照片放大" />
    <span id="lightboxCredit"></span>
  </div>

  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getStats(fid) {
  const list = reviewsMap[fid] || [];
  if (!list.length) return { count: 0, avg: 0, clean: 0, vent: 0, equip: 0, tagCounts: {} };
  let sc = 0, sv = 0, se = 0;
  const tagCounts = {};
  list.forEach(r => {
    sc += Number(r.clean || 3);
    sv += Number(r.vent || 3);
    se += Number(r.equip || 3);
    (r.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const n = list.length;
  return { count: n, clean: sc/n, vent: sv/n, equip: se/n, avg: (sc+sv+se)/(3*n), tagCounts };
}

    const data = await res.json();

      Object.entries(data.reviews).forEach(([fid, list]) => { reviewsMap[fid] = list; });
    }
    if (Array.isArray(data.points)) userPoints = data.points;
    saveLocal();
    pill.textContent = "雲端共編";
    renderPoints();
    if (currentSheetFid) openPointSheet(currentSheetFid);
  } catch (e) {
    pill.textContent = "本機模式";
    pill.className = "sync-pill sync-local";
  }
}

}

function passesFilter(feat) {
  const p = feat.properties || {};
  const st = getStats(p.feature_id);
  const reviews = reviewsMap[p.feature_id] || [];

  if (activeFilter.startsWith("cat:") && p.category !== activeFilter.slice(4)) return false;
  if (activeFilter === "bidet" && !st.tagCounts["有免治馬桶"]) return false;
  if (activeFilter === "top" && st.avg < 4.0) return false;
  if (activeFilter === "24h" && p.is_24h !== "是") return false;
  if (activeFilter === "photo" && !p.photo_file) return false;

  if (searchQuery) {
    const revText = reviews.map(r => `${r.comment} ${(r.tags||[]).join(" ")}`).join(" ");
    const hay = `${p.name||""} ${p.building||""} ${p.description||""} ${p.campus||""} ${p.category||""} ${revText}`.toLowerCase();
    if (!hay.includes(searchQuery)) return false;
  }
  return true;
}

  toiletsGroup.clearLayers();
  const all = getAllFeatures();

  all.forEach(feat => {
    if (!passesFilter(feat)) return;
    const p = feat.properties || {};
    const [lon, lat] = feat.geometry.coordinates;
    const st = getStats(p.feature_id);
    const meta = CATEGORY_META[p.category] || { color: "#475569", radius: 7 };

    const marker = L.circleMarker([lat, lon], {
      renderer: sharedCanvas,
      radius: st.count > 0 ? meta.radius + 1.2 : meta.radius,
      fillColor: meta.color,
      color: st.avg >= 4.5 ? "#facc15" : "#ffffff",
      weight: st.avg >= 4.5 ? 2.6 : 1.8,
      opacity: 1, fillOpacity: 0.92
    });

    if (!isTouchDevice) {
      const starTip = st.count > 0 ? ` ★${st.avg.toFixed(1)}` : "";
      marker.bindTooltip(`${escapeHtml(p.name || "")}${starTip}`, { direction: "top", offset: [0, -6] });
    }

// Client-side Photo Compression (max 900px JPEG ~70-110KB so mobile uploads are fast & free)
let pickedPhotos = { rev: "", newpt: "" };

function handlePhotoPick(input, slot) {
  const file = input.files && input.files[0];
  if (!file) return;
  showToast("正在壓縮處理照片...");
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = img.width > maxW ? (maxW / img.width) : 1;
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      pickedPhotos[slot] = dataUrl;
      const wrap = document.getElementById(slot + "PhotoPreviewWrap");
      const preview = document.getElementById(slot + "PhotoPreviewImg");
      if (wrap && preview) {
        preview.src = dataUrl;
        wrap.style.display = "block";
      }
      showToast("照片已就緒！");
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function clearPickedPhoto(slot) {
  pickedPhotos[slot] = "";
  const wrap = document.getElementById(slot + "PhotoPreviewWrap");
  if (wrap) wrap.style.display = "none";
}

function submitReview(fid) {
  const btn = document.getElementById("submitRevBtn");
  btn.disabled = true;
  const clean = Number(document.getElementById("inClean").value);
  const vent  = Number(document.getElementById("inVent").value);
  const equip = Number(document.getElementById("inEquip").value);
  const comment = document.getElementById("inComment").value.trim();
  const author = document.getElementById("inAuthor").value.trim() || "匿名臺大人";
  const photo_data = pickedPhotos.rev || "";
  const photo_source = (document.getElementById("inPhotoSource")?.value || "").trim() || (author !== "匿名臺大人" ? `${author} 實拍` : "臺大師生實拍");
  const tags = Array.from(document.querySelectorAll("#tagGrid .tag-opt.selected")).map(el => el.dataset.tag);

  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const rec = {
    author, clean, vent, equip, tags,
    photo_url: photo_data,
    photo_source: photo_data ? photo_source : "",
    comment: comment || (tags.length ? tags.join("、") : (photo_data ? "分享實景照片" : `${Math.round((clean+vent+equip)/3)}★ 評分`)),
    time: timeStr
  };

  if (!reviewsMap[fid]) reviewsMap[fid] = [];
  reviewsMap[fid].push(rec);
  pickedPhotos.rev = "";
  saveLocal();
  pushToCloud({
    action: "addReview",
    feature_id: fid,
    review: Object.assign({}, rec, { photo_base64: photo_data, photo_url: "" })
  });

  renderPoints();
  openPointSheet(fid, false);
  showToast("感謝貢獻！你的評分與照片已更新到地圖");
}

function updateUserLocationOnMap(lat, lon, accuracy, flyToUser = false) {
  lastUserPos = { lat, lon, accuracy };
  if (!userMarker) {
    userMarker = L.marker([lat, lon], { icon: userDotIcon, zIndexOffset: 1000 }).addTo(map).bindTooltip("你的目前位置");
  } else {
    userMarker.setLatLng([lat, lon]);
  }
  if (!userAccuracyCircle) {
    userAccuracyCircle = L.circle([lat, lon], {
      radius: Math.min(accuracy || 25, 120),
      color: "#2563eb", fillColor: "#3b82f6", fillOpacity: 0.14, weight: 1
    }).addTo(map);
  } else {
    userAccuracyCircle.setLatLng([lat, lon]);
    userAccuracyCircle.setRadius(Math.min(accuracy || 25, 120));
  }
  if (flyToUser) {
    map.flyTo([lat, lon], Math.max(map.getZoom(), 17));
  }
}

function toggleGpsTracking() {
  if (!navigator.geolocation) { showToast("此瀏覽器不支援 GPS 定位"); return; }
  const fab = document.getElementById("gpsFab");

  if (gpsWatchId !== null) {
    // Already tracking: re-center on user; long-turn off if already centered close by
    if (lastUserPos) {
      map.flyTo([lastUserPos.lat, lastUserPos.lon], 17);
      showToast(`已定位至目前位置（誤差約 ${Math.round(lastUserPos.accuracy || 15)} m）`);
    }
    return;
  }

  fab.classList.add("tracking");
  hasCenteredOnGps = false;
  showToast("正在開啟即時 GPS 定位...");

  gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const shouldFly = !hasCenteredOnGps;
      hasCenteredOnGps = true;
      updateUserLocationOnMap(latitude, longitude, accuracy, shouldFly);
    },
    (err) => {
      fab.classList.remove("tracking");
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      showToast("無法取得定位，請允許瀏覽器存取位置權限");
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function markMyGps() {
  if (lastUserPos) {
    openAddPointSheet(lastUserPos.lat, lastUserPos.lon);
    return;
  }
  if (!navigator.geolocation) { showToast("此瀏覽器不支援 GPS 定位"); return; }
  showToast("正在抓取你的 GPS 座標...");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      updateUserLocationOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, true);
      openAddPointSheet(pos.coords.latitude, pos.coords.longitude);
    },
    () => showToast("無法取得定位，請改點地圖或「畫面中心」"),
    { enableHighAccuracy: true, timeout: 12000 }
  );
}

// Nearby Restrooms Sheet (Mobile GPS 1-Tap)
function renderNearbyList(uLat, uLon) {
  const ranked = getAllFeatures().map(f => {
    const [lon, lat] = f.geometry.coordinates;
    return { feat: f, dist: map.distance([uLat, uLon], [lat, lon]) };
  }).sort((a, b) => a.dist - b.dist).slice(0, 5);

  const listHtml = ranked.map(item => {
    const p = item.feat.properties;
    const st = getStats(p.feature_id);
    const starTxt = st.count ? `★ ${st.avg.toFixed(1)}` : "尚無評分";
    const walkMin = Math.max(1, Math.round(item.dist / 75));
    return `
      <div class="nearby-item" onclick="openPointSheet('${p.feature_id}')">
        <div>
          <div style="font-weight:700;color:#1e3a5f;font-size:14px;">${escapeHtml(p.name)}</div>
          <div style="font-size:12px;color:#64748b;">${escapeHtml(p.category)}｜${starTxt}｜步行 ~${walkMin} 分</div>
        </div>
        <span class="dist-pill">${Math.round(item.dist)} m</span>
      </div>
    `;
  }).join("");

  openSheet("離你最近的 5 間廁所", `<div style="font-size:12.5px;color:#475569;margin-bottom:10px;">點選任一間即可導航或 10 秒快評：</div>` + listHtml);
}

function openNearbySheet() {
  if (lastUserPos) {
    map.flyTo([lastUserPos.lat, lastUserPos.lon], 17);
    renderNearbyList(lastUserPos.lat, lastUserPos.lon);
    return;
  }
  if (!navigator.geolocation) { showToast("此瀏覽器不支援 GPS 定位"); return; }
  showToast("正在定位並計算最近廁所...");
  navigator.geolocation.getCurrentPosition((pos) => {
    const { latitude, longitude, accuracy } = pos.coords;
    updateUserLocationOnMap(latitude, longitude, accuracy, true);
    document.getElementById("gpsFab").classList.add("tracking");
    renderNearbyList(latitude, longitude);
  }, () => showToast("無法取得定位，請允許瀏覽器位置權限"), { enableHighAccuracy: true, timeout: 12000 });
}

// Add New Point Mode (Participatory Mapping)
function toggleAddMode(force) {
  addMode = (typeof force === "boolean") ? force : !addMode;
  document.getElementById("map").classList.toggle("add-mode", addMode);
  document.getElementById("addBanner").style.display = addMode ? "block" : "none";
  const btn = document.getElementById("addDockBtn");
  btn.classList.toggle("danger", addMode);
  btn.classList.toggle("accent", !addMode);
  btn.textContent = addMode ? "取消新增" : "＋ 新增廁所";
  if (addMode) closeSheet();
}

function markMapCenter() {
  const c = map.getCenter();
  openAddPointSheet(c.lat, c.lng);
}

map.on("click", (e) => {
  if (!addMode) return;
  openAddPointSheet(e.latlng.lat, e.latlng.lng);
});

function openAddPointSheet(lat, lon) {
  pickedPhotos.newpt = "";
  const html = `
    <div class="coord-line" style="margin-bottom:8px;">已選座標（WGS84）：${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
    <label class="field-label">館舍與廁所名稱 *</label>
    <input type="text" id="newName" class="input-el" placeholder="例如：社科圖 4F 東側廁所" />
    <label class="field-label">廁所類別</label>
    <select id="newCat" class="input-el">
      <option value="師生共編點位">師生共編點位（一般／隱藏版）</option>
      <option value="性別友善廁所">性別友善廁所</option>
      <option value="無障礙廁所">無障礙廁所</option>
      <option value="公共廁所樞紐">公共廁所樞紐</option>
    </select>
    <label class="field-label">樓層與特色說明</label>
    <textarea id="newDesc" class="input-el" rows="2" placeholder="例如：4樓電梯旁，有免治馬桶、很安靜"></textarea>
    <label class="field-label">上傳實景照片（選填）</label>
    <label class="upload-btn">
      <input type="file" accept="image/*" style="display:none;" onchange="handlePhotoPick(this, 'newpt')" />
      拍照或從相簿選擇照片
    </label>
    <div class="upload-preview-wrap" id="newptPhotoPreviewWrap">
      <img id="newptPhotoPreviewImg" src="" alt="上傳預覽" />
      <button type="button" class="upload-remove-btn" onclick="clearPickedPhoto('newpt')">×</button>
    </div>
    <label class="field-label">你的系級／暱稱（選填）</label>
    <input type="text" id="newAuthor" class="input-el" placeholder="匿名臺大人" />
    <button class="btn-big btn-rate" style="margin-top:12px;" onclick="submitNewPoint(${lat}, ${lon})">送出並標記到地圖</button>
  `;
  openSheet("參與式新增遺漏廁所", html);
}

function submitNewPoint(lat, lon) {
  const name = document.getElementById("newName").value.trim();
  if (!name) { showToast("請輸入館舍與廁所名稱！"); return; }
  const category = document.getElementById("newCat").value;
  const description = document.getElementById("newDesc").value.trim();
  const author = document.getElementById("newAuthor").value.trim() || "匿名臺大人";
  const photo_data = pickedPhotos.newpt || "";
  const photo_source = photo_data ? (author !== "匿名臺大人" ? `${author} 實拍` : "臺大師生實拍") : "";
  const fid = "vgi_" + Date.now();

  const newFeat = {
    type: "Feature",
    geometry: { type: "Point", coordinates: [Number(lon.toFixed(6)), Number(lat.toFixed(6))] },
    properties: {
      feature_id: fid, category, campus: "參與式新增", name,
      description: `${description}（由 ${author} 共編新增）`,
      is_24h: description.includes("24小時") || description.includes("24H") ? "是" : "否",
      source: "PPGIS_User", photo_file: "",
      photo_url: photo_data, photo_source
    }
  };
  userPoints.push(newFeat);
  pickedPhotos.newpt = "";
  saveLocal();
  pushToCloud({
    action: "addPoint",
    feature: newFeat,
    photo_base64: photo_data
  });
  toggleAddMode(false);
  renderPoints();
  openPointSheet(fid);
  showToast("已新增到地圖！歡迎接著給它第一個評分");
}

function flyCampus(which) {
  closeSheet();
  if (which === "main") map.flyTo([25.0174, 121.5396], 16);
  else if (which === "shuiyuan") map.flyTo([25.0139, 121.5290], 17);
  else if (which === "downtown") map.flyTo([25.0410, 121.5212], 17);
}

function exportVGI(fmt) {
  const all = getAllFeatures().map(f => {
    const p = Object.assign({}, f.properties);
    const st = getStats(p.feature_id);
    p.rating_count = st.count;
    p.rating_avg = st.count ? Number(st.avg.toFixed(2)) : null;
    p.clean_avg  = st.count ? Number(st.clean.toFixed(2)) : null;
    p.vent_avg   = st.count ? Number(st.vent.toFixed(2)) : null;
    p.equip_avg  = st.count ? Number(st.equip.toFixed(2)) : null;
    p.crowd_tags = Object.keys(st.tagCounts).join(";");
    p.latest_comment = (reviewsMap[p.feature_id] || []).slice(-1)[0]?.comment || "";
    return { type: "Feature", geometry: f.geometry, properties: p };
  });
  let blob, filename;
  if (fmt === "geojson") {
    blob = new Blob([JSON.stringify({ type: "FeatureCollection", name: "NTU_Restrooms_PPGIS", features: all }, null, 2)], { type: "application/geo+json;charset=utf-8" });
    filename = "台大廁所_參與式評分資料.geojson";
  } else {
    const cols = ["feature_id","category","campus","name","lat","lon","rating_count","rating_avg","clean_avg","vent_avg","equip_avg","crowd_tags","latest_comment"];
    const lines = [cols.join(",")];
    all.forEach(f => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      lines.push([p.feature_id, p.category, p.campus, p.name, lat, lon, p.rating_count, p.rating_avg ?? "", p.clean_avg ?? "", p.vent_avg ?? "", p.equip_avg ?? "", p.crowd_tags, p.latest_comment].map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(","));
    });
    blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    filename = "台大廁所_參與式評分資料.csv";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

  renderPoints();
}

renderPoints();
syncFromCloud();

const params = new URLSearchParams(location.search);
if (params.get("q")) {
  searchInput.value = params.get("q");
  searchQuery = params.get("q").trim().toLowerCase();
  document.getElementById("clearSearchBtn").style.display = "inline-flex";
  renderPoints();
}
