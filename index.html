<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>臺大廁所參與式地圖｜NTU Restroom PPGIS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --navy: #1e3a5f;
    --blue: #1d4ed8;
    --violet: #7c3aed;
    --teal: #0d9488;
    --amber: #d97706;
    --rose: #e11d48;
    --bg-glass: rgba(255, 255, 255, 0.96);
    --shadow: 0 6px 24px rgba(15, 23, 42, 0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #e2e8f0;
    overflow: hidden;
  }
  #map { width: 100%; height: 100%; }
  #map.add-mode { cursor: crosshair !important; }

  /* Top Floating Search & Quick Chips (Google Maps Mobile Style) */
  .top-bar {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
    z-index: 1000; width: calc(100vw - 20px); max-width: 440px; pointer-events: none;
  }
  .search-wrap {
    pointer-events: auto; width: 100%;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 999px; padding: 6px 10px;
    box-shadow: var(--shadow); border: 1px solid rgba(203, 213, 225, 0.9);
  }
  .brand-dot {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy), var(--violet));
    color: #fff; font-weight: 800; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .search-input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 13.5px; color: #0f172a; min-width: 0; width: 100%; padding: 4px 2px;
  }
  .clear-btn {
    display: none; border: none; background: #e2e8f0; color: #475569;
    width: 22px; height: 22px; border-radius: 50%; font-size: 13px; cursor: pointer;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sync-pill {
    font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; flex-shrink: 0;
  }
  .sync-local { background: #e0f2fe; color: #0369a1; }
  .sync-cloud { background: #dcfce7; color: #15803d; }

  .search-dropdown {
    display: none; pointer-events: auto; margin-top: 6px;
    background: #ffffff; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    border: 1px solid #cbd5e1; overflow: hidden;
    max-height: 270px; overflow-y: auto;
  }
  .search-dd-item {
    padding: 9px 13px; border-bottom: 1px solid #f1f5f9;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .search-dd-item:last-child { border-bottom: none; }
  .search-dd-item:hover, .search-dd-item:active { background: #f8fafc; }
  .search-dd-name { font-size: 13.5px; font-weight: 700; color: #1e3a5f; }
  .search-dd-sub { font-size: 11.5px; color: #64748b; }

  .help-btn {
    border: none; background: #f1f5f9; color: #334155;
    width: 26px; height: 26px; border-radius: 50%;
    font-size: 13px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .help-btn:hover { background: #e2e8f0; }

  /* First-visit Illustrated Guide Modal */
  .guide-bg {
    display: none; position: fixed; inset: 0; z-index: 2300;
    background: rgba(15, 23, 42, 0.56);
    justify-content: center; align-items: center; padding: 16px;
  }
  .guide-card {
    background: #ffffff; border-radius: 18px; width: 100%; max-width: 390px;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.32);
    overflow: hidden;
  }
  .guide-head {
    background: linear-gradient(135deg, #1e3a5f 0%, #2d5a88 60%, #6d28d9 100%);
    color: #fff; padding: 16px 18px 14px 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .guide-head h2 { margin: 0; font-size: 17px; letter-spacing: 0.3px; }
  .guide-head p { margin: 3px 0 0 0; font-size: 12px; color: #dbeafe; }
  .guide-close {
    border: none; background: rgba(255,255,255,0.2); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .guide-body { padding: 14px 16px 16px 16px; }
  .guide-step {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; border: 1px solid #e2e8f0; border-radius: 12px;
    background: #f8fafc; margin-bottom: 10px;
  }
  .guide-illus {
    width: 68px; height: 56px; border-radius: 10px; flex-shrink: 0;
    background: #ffffff; border: 1px solid #dbe4ef;
    display: flex; align-items: center; justify-content: center;
  }
  .guide-step-title { font-size: 13.5px; font-weight: 800; color: #1e3a5f; margin-bottom: 2px; }
  .guide-step-desc { font-size: 12px; color: #475569; line-height: 1.4; }
  .guide-footer {
    display: flex; flex-direction: column; gap: 8px; margin-top: 6px;
  }
  .guide-check {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: #64748b; cursor: pointer;
  }

  /* Lightweight Lazy-Loaded Floor Plan Modal */
  .fp-bg {
    display: none; position: fixed; inset: 0; z-index: 2350;
    background: rgba(15, 23, 42, 0.62);
    justify-content: center; align-items: center; padding: 14px;
  }
  .fp-card {
    background: #ffffff; border-radius: 16px; width: 100%; max-width: 520px;
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.35);
  }
  .fp-head {
    background: #1e3a5f; color: #fff; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .fp-head h3 { margin: 0; font-size: 15.5px; }
  .fp-body { padding: 12px 14px 16px 14px; overflow-y: auto; }
  .fp-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .fp-tab {
    padding: 5px 11px; border-radius: 999px; border: 1px solid #cbd5e1;
    background: #f8fafc; color: #334155; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .fp-tab.active { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .fp-img-box {
    position: relative; width: 100%; min-height: 160px; background: #f1f5f9;
    border-radius: 10px; overflow: hidden; border: 1px solid #cbd5e1;
    display: flex; align-items: center; justify-content: center;
  }
  .fp-img-box img { width: 100%; height: auto; display: block; cursor: zoom-in; }
  .fp-desc {
    margin-top: 10px; padding: 9px 11px; background: #f8fafc;
    border-radius: 10px; border: 1px solid #e2e8f0;
    font-size: 12.5px; color: #334155; line-height: 1.5;
  }
  .btn-fp {
    background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc;
    padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 700;
    cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
  }

  .chips-scroll {
    pointer-events: auto;
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 4px 2px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid rgba(203,213,225,0.9);
    background: var(--bg-glass); color: #1e293b;
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(15,23,42,0.1); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip .c-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Add-Point Instruction Banner */
  .add-banner {
    display: none; position: fixed; top: 104px; left: 50%; transform: translateX(-50%);
    z-index: 1050; background: var(--violet); color: #fff; padding: 9px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 8px 20px rgba(124,58,237,0.35);
  }
  .add-banner button {
    margin-left: 8px; background: rgba(255,255,255,0.25); border: none;
    color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }

  /* Floating GPS Locate Button (Google Maps Style, bottom-right above zoom) */
  .gps-fab {
    position: fixed; right: 12px; bottom: 92px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid rgba(203,213,225,0.95);
    box-shadow: 0 4px 14px rgba(15,23,42,0.2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #334155; transition: transform 0.15s;
  }
  .gps-fab.tracking {
    background: #2563eb; color: #ffffff; border-color: #1d4ed8;
    box-shadow: 0 4px 16px rgba(37,99,235,0.45);
  }
  .gps-fab:active { transform: scale(0.93); }

  /* Pulsing Blue User Location Dot */
  .user-dot-wrap { position: relative; width: 20px; height: 20px; }
  .user-dot-pulse {
    position: absolute; inset: -6px; border-radius: 50%;
    background: rgba(37, 99, 235, 0.28);
    animation: gpsPulse 2s ease-out infinite;
  }
  .user-dot-core {
    position: absolute; inset: 2px; border-radius: 50%;
    background: #2563eb; border: 3px solid #ffffff;
    box-shadow: 0 1px 6px rgba(15,23,42,0.4);
  }
  @keyframes gpsPulse {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  .dist-badge {
    display: inline-block; background: #ccfbf1; color: #0f766e;
    font-size: 11.5px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; margin-top: 4px;
  }

  /* Bottom Navigation / Action Bar (Thumb Zone) */
  .bottom-dock {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; justify-content: center; align-items: center; gap: 6px; padding: 5px 6px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 999px; box-shadow: var(--shadow); border: 1px solid rgba(203,213,225,0.9);
    width: max-content; max-width: calc(100vw - 16px);
  }
  .dock-btn {
    border: none; background: transparent; color: #1e293b;
    padding: 8px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
  }
  .dock-btn.primary { background: var(--teal); color: #fff; }
  .dock-btn.accent  { background: var(--violet); color: #fff; }
  .dock-btn.danger  { background: #dc2626; color: #fff; }
  .dock-btn:active  { transform: scale(0.97); }

  /* Bottom Sheet (Mobile Full-Width Drawer / Desktop Left Card) */
  .sheet-backdrop {
    display: none; position: fixed; inset: 0; z-index: 1190;
    background: rgba(15, 23, 42, 0.28);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200;
    background: #ffffff; border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(15, 23, 42, 0.22);
    max-height: 82vh; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 768px) {
    .sheet {
      left: 14px; right: auto; bottom: 14px; width: 410px;
      border-radius: 16px; max-height: calc(100vh - 120px);
    }
    .sheet-backdrop { background: transparent; pointer-events: none; }
  }
  .sheet-handle {
    width: 40px; height: 4px; background: #cbd5e1; border-radius: 999px;
    margin: 9px auto 4px auto; flex-shrink: 0;
  }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    padding: 4px 16px 10px 16px; border-bottom: 1px solid #e2e8f0;
  }
  .sheet-title { font-size: 17px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .sheet-close {
    border: none; background: #f1f5f9; color: #475569; width: 32px; height: 32px;
    border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .sheet-body {
    padding: 12px 16px 18px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  /* Badges & Summary */
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    color: #fff; font-size: 11.5px; font-weight: 700; margin-right: 4px; margin-top: 4px;
  }
  .badge-24h { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
  .rating-summary {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 10px 12px; margin: 10px 0;
  }
  .rating-big { font-size: 20px; font-weight: 800; color: #d97706; }
  .sub-scores { display: flex; gap: 12px; font-size: 12px; color: #475569; margin-top: 4px; }
  .tag-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tag-pill {
    background: #ede9fe; color: #5b21b6; font-size: 11.5px;
    padding: 3px 9px; border-radius: 999px; font-weight: 600;
  }
  .photo-frame {
    position: relative; width: 100%; margin: 8px 0; border-radius: 10px; overflow: hidden;
    border: 1px solid #cbd5e1;
  }
  .hero-photo {
    width: 100%; max-height: 190px; object-fit: cover;
    cursor: zoom-in; display: block;
  }
  .photo-credit {
    position: absolute; right: 6px; bottom: 6px;
    background: rgba(15, 23, 42, 0.72); color: #f8fafc;
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    backdrop-filter: blur(4px); pointer-events: none; line-height: 1.3;
  }
  .review-photo-frame {
    position: relative; display: inline-block; margin-top: 6px; border-radius: 8px; overflow: hidden;
    border: 1px solid #cbd5e1; max-width: 100%;
  }
  .review-photo {
    max-width: 100%; max-height: 140px; object-fit: cover; display: block; cursor: zoom-in;
  }
  .upload-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px 12px; border: 1.5px dashed #7c3aed; border-radius: 10px;
    background: #f5f3ff; color: #5b21b6; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 6px; text-align: center;
  }
  .upload-btn:active { background: #ede9fe; }
  .upload-notice {
    margin-top: 6px; padding: 6px 9px; border-radius: 8px;
    background: #fffbeb; border: 1px solid #fcd34d;
    color: #92400e; font-size: 11px; line-height: 1.45;
  }
  .upload-preview-wrap {
    display: none; position: relative; margin-top: 8px; border-radius: 10px;
    overflow: hidden; border: 1px solid #cbd5e1; background: #0f172a;
  }
  .upload-preview-wrap img {
    width: 100%; max-height: 160px; object-fit: cover; display: block;
  }
  .upload-remove-btn {
    position: absolute; top: 6px; right: 6px; border: none;
    background: rgba(15,23,42,0.78); color: #fff; width: 26px; height: 26px;
    border-radius: 50%; font-size: 15px; cursor: pointer;
  }
  .meta-line { font-size: 13px; color: #334155; margin: 4px 0; }
  .coord-line { font-family: Consolas, monospace; font-size: 11.5px; color: #0f766e; }

  .cta-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 12px 0; }
  .btn-big {
    width: 100%; padding: 12px 14px; border: none; border-radius: 12px;
    font-size: 14.5px; font-weight: 800; cursor: pointer;
  }
  .btn-rate { background: linear-gradient(135deg, var(--violet), #5b21b6); color: #fff; }
  .btn-nav  { background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe; padding: 12px 14px; text-decoration: none; font-size: 13px; font-weight: 700; border-radius: 12px; display: inline-flex; align-items: center; }
  .btn-sub  { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  /* 5-Second Star Picker & Tag Pills Form */
  .rate-box {
    background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px;
    padding: 12px; margin-top: 8px;
  }
  .star-picker {
    display: flex; justify-content: space-between; gap: 6px; margin: 6px 0 10px 0;
  }
  .star-btn {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid #cbd5e1;
    background: #fff; font-size: 20px; color: #cbd5e1; cursor: pointer;
    transition: transform 0.1s;
  }
  .star-btn.lit { color: #f59e0b; border-color: #fbbf24; background: #fffbeb; }
  .star-btn:active { transform: scale(0.94); }

  .tag-grid { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0 12px 0; }
  .tag-opt {
    padding: 7px 11px; border-radius: 999px; border: 1px solid #cbd5e1;
    background: #fff; font-size: 12.5px; font-weight: 600; color: #334155;
    cursor: pointer; user-select: none;
  }
  .tag-opt.selected { background: var(--violet); color: #fff; border-color: var(--violet); }

  .field-label { font-size: 12px; font-weight: 700; color: #334155; margin: 8px 0 4px 0; display: block; }
  .input-el {
    width: 100%; padding: 10px 11px; border: 1px solid #cbd5e1; border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  .input-el:focus { border-color: var(--violet); }
  .sub-score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }

  .floor-pill {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 1px 7px; border-radius: 999px; margin-left: 5px;
  }
  .floor-1f { background: #dcfce7; color: #166534; }
  .floor-other { background: #e0e7ff; color: #3730a3; }
  .floor-tabs {
    display: flex; gap: 6px; margin: 8px 0 6px 0;
  }
  .floor-tab {
    flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #cbd5e1;
    background: #fff; color: #334155; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .floor-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* Review List */
  .review-item { border-top: 1px solid #e2e8f0; padding: 9px 0; }
  .review-head { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
  .review-body { font-size: 13.5px; color: #0f172a; margin-top: 3px; }

  /* Nearby List Item */
  .nearby-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 12px; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 8px; cursor: pointer; background: #fff;
  }
  .nearby-item:active { background: #f1f5f9; }
  .dist-pill {
    background: #ccfbf1; color: #0f766e; font-weight: 800; font-size: 12.5px;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  }

  /* Toast */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2500; background: rgba(15, 23, 42, 0.9); color: #fff;
    padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700;
    display: none; text-align: center; max-width: 85vw;
  }

  /* Lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 2400;
    background: rgba(15, 23, 42, 0.88);
    justify-content: center; align-items: center; padding: 16px; cursor: zoom-out;
  }
  .lightbox-inner { position: relative; max-width: 94vw; max-height: 90vh; }
  #lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 10px; display: block; }
  #lightboxCredit {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(15, 23, 42, 0.78); color: #f8fafc;
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
  }

  .bldg-tip {
    background: rgba(30, 58, 95, 0.9); color: #fff; border: none;
    border-radius: 4px; padding: 2px 6px; font-size: 11px;
  }
  .ntu-label {
    pointer-events: none; white-space: nowrap; text-align: center;
    font-size: 11px; font-weight: 700; color: #1e3a5f;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 4px #fff;
    transform: translate(-50%, -50%);
  }
  .ntu-sub-label {
    pointer-events: none; white-space: nowrap; text-align: center;
    font-size: 10.5px; font-weight: 600; color: #334155;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
    transform: translate(-50%, -50%);
  }

<body>

<div id="map"></div>

<!-- Top Floating Search + Horizontal Filter Chips -->
<div class="top-bar">
  <div class="search-wrap">
    <div class="brand-dot">NTU</div>
    <input type="text" id="searchInput" class="search-input" placeholder="搜館舍或標籤（地理系、總圖、免治...）" autocomplete="off" />
    <button class="clear-btn" id="clearSearchBtn" onclick="clearSearch()">×</button>
    <button class="help-btn" onclick="openGuideModal()" title="操作說明">?</button>
  </div>
  <div class="search-dropdown" id="searchDropdown"></div>
  <div class="chips-scroll" id="chipsScroll">
    <button class="chip chip-rank" onclick="openLeaderboardSheet('top')">🏆 好評榜</button>
    <button class="chip active" data-filter="all" onclick="toggleQuickChip(this, 'all')">全部 (<span id="totalBadge">0</span>)</button>
    <button class="chip" data-filter="cat:性別友善廁所" onclick="toggleQuickChip(this, 'cat:性別友善廁所')"><span class="c-dot" style="background:#7c3aed"></span>性別友善</button>
    <button class="chip" data-filter="cat:無障礙廁所" onclick="toggleQuickChip(this, 'cat:無障礙廁所')"><span class="c-dot" style="background:#0d9488"></span>無障礙</button>
    <button class="chip" data-filter="cat:一般廁所" onclick="toggleQuickChip(this, 'cat:一般廁所')"><span class="c-dot" style="background:#64748b"></span>一般廁所</button>
    <button class="chip" data-filter="bidet" onclick="toggleQuickChip(this, 'bidet')">有免治馬桶</button>
    <button class="chip" data-filter="top" onclick="toggleQuickChip(this, 'top')">4★ 以上好評</button>
    <button class="chip" data-filter="24h" onclick="toggleQuickChip(this, '24h')">24H 開放</button>
    <button class="chip" data-filter="photo" onclick="toggleQuickChip(this, 'photo')">附實景照</button>
    <button class="chip active" id="chipBldg" onclick="toggleBuildings()">建物輪廓</button>
  </div>
</div>

<!-- Add Mode Banner -->
<div class="add-banner" id="addBanner">
  點擊地圖標記位置
  <button onclick="markMyGps()">標記我的位置</button>
  <button onclick="markMapCenter()">畫面中心</button>
  <button onclick="toggleAddMode(false)">取消</button>
</div>

<!-- Google Maps Style Floating GPS Locate Button -->
<button class="gps-fab" id="gpsFab" onclick="toggleGpsTracking()" title="即時 GPS 定位（顯示我的位置）" aria-label="即時 GPS 定位">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
  </svg>
</button>

<!-- Bottom Thumb-Zone Dock -->
<div class="bottom-dock">
  <button class="dock-btn primary" onclick="openNearbySheet()">附近廁所</button>
  <button class="dock-btn accent" id="addDockBtn" onclick="toggleAddMode()">＋ 新增廁所</button>
  <button class="dock-btn" onclick="openToolsSheet()">更多／回饋</button>
</div>

<!-- Universal Bottom Sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheetTitle"></div>
    <button class="sheet-close" onclick="closeSheet()">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 3-Step Illustrated Welcome Guide Modal -->
<div class="guide-bg" id="guideModal" onclick="if(event.target===this) closeGuideModal()">
  <div class="guide-card">
    <div class="guide-head">
      <div>
        <h2>歡迎使用臺大廁所地圖</h2>
        <p>3 個小步驟，一起共編最好用的校園如廁指南</p>
      </div>
      <button class="guide-close" onclick="closeGuideModal()">×</button>
    </div>
    <div class="guide-body">
      <div class="guide-step">
        <div class="guide-illus">
          <svg width="58" height="46" viewBox="0 0 58 46" fill="none">
            <rect x="4" y="4" width="50" height="12" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
            <circle cx="11" cy="10" r="3" fill="#1d4ed8"/>
            <rect x="17" y="8.5" width="24" height="3" rx="1.5" fill="#93c5fd"/>
            <rect x="4" y="21" width="23" height="10" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>

            <circle cx="38" cy="27" r="4.5" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/>
            <circle cx="49" cy="34" r="4" fill="#0d9488" stroke="#fff" stroke-width="1.5"/>
            <circle cx="28" cy="38" r="4" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/>
          </svg>
        </div>
        <div>
          <div class="guide-step-title">1. 搜館舍、看 🏆 好評榜</div>
          <div class="guide-step-desc">輸入館名或點「好評榜」找高分與免治馬桶；點地圖圓點可看實景照與一樓／樓上評價。</div>
        </div>
      </div>

      <div class="guide-step">
        <div class="guide-illus">
          <svg width="58" height="46" viewBox="0 0 58 46" fill="none">
            <text x="29" y="16" text-anchor="middle" font-size="11" fill="#f59e0b">★★★★★</text>
            <rect x="5" y="22" width="22" height="9" rx="4.5" fill="#7c3aed"/>
            <text x="16" y="28.5" text-anchor="middle" font-size="6" fill="#fff">免治</text>
            <rect x="30" y="22" width="23" height="9" rx="4.5" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
            <text x="41.5" y="28.5" text-anchor="middle" font-size="6" fill="#166534">一樓</text>
            <rect x="14" y="34" width="30" height="9" rx="4.5" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="2 1.5"/>
            <text x="29" y="40.5" text-anchor="middle" font-size="6" fill="#5b21b6">拍照上傳</text>
          </svg>
        </div>
        <div>
          <div class="guide-step-title">2. 10 秒快評與拍照分享</div>
          <div class="guide-step-desc">點「我要評分」選樓層、星星與快速標籤即可送出，也歡迎用手機拍實景照（勿拍到他人）。</div>
        </div>
      </div>

      <div class="guide-step">
        <div class="guide-illus">
          <svg width="58" height="46" viewBox="0 0 58 46" fill="none">
            <circle cx="19" cy="18" r="11" fill="#dbeafe"/>
            <circle cx="19" cy="18" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="2"/>
            <rect x="33" y="8" width="21" height="11" rx="5.5" fill="#0d9488"/>
            <text x="43.5" y="15.5" text-anchor="middle" font-size="6" fill="#fff">附近</text>
            <rect x="33" y="24" width="21" height="11" rx="5.5" fill="#7c3aed"/>
            <text x="43.5" y="31.5" text-anchor="middle" font-size="6" fill="#fff">＋新增</text>
          </svg>
        </div>
        <div>
          <div class="guide-step-title">3. 即時定位＆新增隱藏廁所</div>
          <div class="guide-step-desc">點「附近廁所」或右下 🎯 找離你最近的廁所；發現漏掉的好廁所也能點「＋新增」標上去！</div>
        </div>
      </div>

      <div class="guide-footer">
        <button class="btn-big btn-rate" onclick="closeGuideModal()">開始探索地圖</button>
        <label class="guide-check">
          <input type="checkbox" id="guideDontShow" checked />
          下次開啟不再自動顯示（可隨時點右上「?」重看）
        </label>
      </div>
    </div>
  </div>
</div>

<div class="fp-bg" id="fpModal" onclick="if(event.target===this) closeFloorPlanModal()">

</div>

</div>

// 將使用者輸入的精確樓層（B2~6F+）歸類為前台顯示的「一樓」或「一樓以外」
function getFloorGroup(floorStr) {
  const f = String(floorStr || "").trim().toUpperCase();
  if (!f || f === "不確定") return "";
  if (f === "1F" || f === "1" || f === "1樓" || f === "一樓") return "一樓";
  return "一樓以外";
}

const LS_REVIEWS_KEY = "ntu_ppgis_reviews_v1";
const LS_POINTS_KEY  = "ntu_ppgis_newpoints_v1";

let reviewsMap = JSON.parse(localStorage.getItem(LS_REVIEWS_KEY) || "null") || JSON.parse(JSON.stringify(DEFAULT_REVIEWS));
let userPoints = JSON.parse(localStorage.getItem(LS_POINTS_KEY) || "[]");
let activeFilter = "all";
let searchQuery = "";
let addMode = false;
let currentSheetFid = null;

function saveLocal() {
  localStorage.setItem(LS_REVIEWS_KEY, JSON.stringify(reviewsMap));
  localStorage.setItem(LS_POINTS_KEY, JSON.stringify(userPoints));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2200);
}

function escapeHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function formatReviewTime(t) {
  const s = String(t || "").trim();
  if (!s) return "";
  if (/^\d4-\d2(-\d2)?$/.test(s)) return s;
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return s.slice(0, 16);
}

function getAllFeatures() {
  return [...BASE_TOILETS.features, ...userPoints];
}

function getStats(fid) {
  const list = reviewsMap[fid] || [];
  if (!list.length) return { count: 0, avg: 0, clean: 0, vent: 0, equip: 0, tagCounts: {} };
  let sc = 0, sv = 0, se = 0;
  const tagCounts = {};
  list.forEach(r => {
    sc += Number(r.clean || 3);
    sv += Number(r.vent || 3);
    se += Number(r.equip || 3);
    (r.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const n = list.length;
  return { count: n, clean: sc/n, vent: sv/n, equip: se/n, avg: (sc+sv+se)/(3*n), tagCounts };
}

// Cloud Sync
let cloudSyncStatus = CLOUD_API_URL ? "雲端共編連線中" : "本機測試模式";
async function syncFromCloud() {
  if (!CLOUD_API_URL) return;
  try {
    const res = await fetch(CLOUD_API_URL + "?action=getAll");
    const data = await res.json();
    if (data.reviews) {
      Object.entries(data.reviews).forEach(([fid, list]) => {
        if (fid === "__SITE_FEEDBACK__") return;
        reviewsMap[fid] = list;
      });
    }
    if (Array.isArray(data.points)) userPoints = data.points;
    saveLocal();
    cloudSyncStatus = "雲端共編已連線";
    renderPoints();
    if (currentSheetFid) openPointSheet(currentSheetFid);
  } catch (e) {
    cloudSyncStatus = "暫時離線（本機快取）";
  }
}

async function pushToCloud(payload) {
  if (!CLOUD_API_URL) return;
  try {
    await fetch(CLOUD_API_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
  } catch (e) {}
}

// 智慧動態點擊判定：縮小時放寬觸控熱區（小灰點超好按），放大到較大比例尺（zoom >= 17）自動收緊並取螢幕像素最近點，避免誤判重疊！
map.on("click", (e) => {
  searchDropdown.style.display = "none";
  if (addMode) {
    openAddPointSheet(e.latlng.lat, e.latlng.lng);
    return;
  }
  const z = map.getZoom();
  // 隨比例尺動態調整判定半徑（px）：放越大判定越精準不重疊
  const hitRadiusPx = z >= 18 ? 11 : (z === 17 ? 15 : 22);
  const clickPt = map.latLngToContainerPoint(e.latlng);

  const candidates = [];
  visibleFeaturesCache.forEach(feat => {
    const [lon, lat] = feat.geometry.coordinates;
    const pt = map.latLngToContainerPoint([lat, lon]);
    const dx = pt.x - clickPt.x;
    const dy = pt.y - clickPt.y;
    const pxDist = Math.hypot(dx, dy);
    const r = (CATEGORY_META[feat.properties.category]?.radius || 6);
    if (pxDist <= Math.max(hitRadiusPx, r + 4)) {
      candidates.push({ feat, pxDist });
    }
  });

  if (!candidates.length) {
    const hitBldg = findBuildingAt(e.latlng.lat, e.latlng.lng);
    if (hitBldg) openBuildingSheet(hitBldg);
    return;
  }
  candidates.sort((a, b) => a.pxDist - b.pxDist);

  // 若極近處（8px 內）有多顆幾乎完全重疊的點位，彈出精簡選單避免誤點；否則直接開最近那顆！
  const overlapped = candidates.filter(c => Math.abs(c.pxDist - candidates[0].pxDist) <= 6 && c.pxDist <= 10);
  if (overlapped.length > 1) {
    const pickHtml = overlapped.slice(0, 6).map(c => {
      const p = c.feat.properties;
      const meta = CATEGORY_META[p.category] || { color: "#64748b" };
      const st = getStats(p.feature_id);
      const starTxt = st.count ? `★ ${st.avg.toFixed(1)}` : "尚無評分";
      return `
        <div class="nearby-item" onclick="openPointSheet('${p.feature_id}')">
          <div>
            <div style="font-weight:700;color:#1e3a5f;font-size:14px;">${escapeHtml(p.name)}</div>
            <div style="font-size:12px;color:#64748b;"><span class="c-dot" style="background:${meta.color};width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;"></span>${escapeHtml(p.category)}｜${starTxt}</div>
          </div>
          <span style="font-size:12px;color:#7c3aed;font-weight:700;">查看 &rarr;</span>
        </div>
      `;
    }).join("");
    openSheet("此處有多間相鄰廁所，請選擇", pickHtml);
  } else {
    openPointSheet(candidates[0].feat.properties.feature_id);
  }
});

// ================= 建築物點擊查詢（館內有哪些廁所）＆ 室內平面圖地圖套疊 =================
function pointInRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function pointInGeom(lon, lat, geom) {
  if (!geom || !geom.coordinates) return false;
  if (geom.type === "Polygon") {
    if (!pointInRing(lon, lat, geom.coordinates[0])) return false;
    for (let h = 1; h < geom.coordinates.length; h++) {
      if (pointInRing(lon, lat, geom.coordinates[h])) return false;
    }
    return true;
  }
  if (geom.type === "MultiPolygon") {
    return geom.coordinates.some(poly => {
      if (!pointInRing(lon, lat, poly[0])) return false;
      for (let h = 1; h < poly.length; h++) {
        if (pointInRing(lon, lat, poly[h])) return false;
      }
      return true;
    });
  }
  return false;
}

function findBuildingAt(lat, lon) {
  if (!bldgUserEnabled || map.getZoom() < 15) return null;
  const feats = (BUILDINGS_DATA && BUILDINGS_DATA.features) || [];
  for (let i = 0; i < feats.length; i++) {
    const f = feats[i];
    if (pointInGeom(lon, lat, f.geometry)) return f;
  }
  return null;
}

function getBuildingToilets(bldgFeat) {
  const bName = ((bldgFeat.properties && bldgFeat.properties.name_ch) || "").trim();
  const all = getAllFeatures();
  const matched = [];
  const seen = new Set();
  all.forEach(feat => {
    const [lon, lat] = feat.geometry.coordinates;
    const p = feat.properties || {};
    const fid = p.feature_id;
    const inPoly = pointInGeom(lon, lat, bldgFeat.geometry);
    let nameMatch = false;
    if (bName && bName.length >= 2) {
      const hay = `${p.building || ""} ${p.name || ""}`;
      if (hay.includes(bName)) nameMatch = true;
      else if (bName === "總圖書館" && hay.includes("圖書館") && !hay.includes("舊圖") && !hay.includes("社科") && !hay.includes("醫") && !hay.includes("圖書資訊")) nameMatch = true;
    }
    if ((inPoly || nameMatch) && !seen.has(fid)) {
      seen.add(fid);
      matched.push(feat);
    }
  });
  return matched;
}

// 室內平面圖套疊控制器（僅載入當前單張透明壓縮圖，關閉或縮小即釋放記憶體）
let activeIndoorKey = null;
let activeIndoorFloor = null;
let activeIndoorLayer = null;

function activateIndoorOverlay(bldgKey, floorName, skipFly = false) {
  const entry = FLOORPLANS_DATA[bldgKey];
  if (!entry) return;
  const ovFloors = (entry.floors || []).filter(fl => fl.overlay && fl.bounds);
  if (!ovFloors.length) return;
  const targetFl = ovFloors.find(fl => fl.floor === floorName) || ovFloors[0];

  if (activeIndoorLayer) {
    map.removeLayer(activeIndoorLayer);
    activeIndoorLayer = null;
  }
  activeIndoorKey = bldgKey;
  activeIndoorFloor = targetFl.floor;

  activeIndoorLayer = L.imageOverlay(targetFl.overlay, targetFl.bounds, {
    pane: "indoorPane",
    opacity: 0.94,
    interactive: false
  }).addTo(map);

  if (!skipFly && entry.center) {
    const z = map.getZoom();
    map.setView(entry.center, z < 18 ? 18 : z, { animate: true });
  }
  renderIndoorBar();
  showToast(`已套疊 ${bldgKey} ${targetFl.floor} 平面圖（可於右側切換樓層）`);
}

function closeIndoorOverlay(silent = false) {
  if (activeIndoorLayer) {
    map.removeLayer(activeIndoorLayer);
    activeIndoorLayer = null;
  }
  activeIndoorKey = null;
  activeIndoorFloor = null;
  renderIndoorBar();
  if (!silent) showToast("已關閉室內平面圖套疊");
}

function renderIndoorBar() {
  const bar = document.getElementById("indoorBar");
  if (!bar) return;
  if (activeIndoorKey && FLOORPLANS_DATA[activeIndoorKey]) {
    const entry = FLOORPLANS_DATA[activeIndoorKey];
    const ovFloors = (entry.floors || []).filter(fl => fl.overlay && fl.bounds);
    bar.innerHTML = `
      <div class="indoor-bar-title">${escapeHtml(activeIndoorKey.replace("圖書館","圖"))}</div>
      ${ovFloors.map(fl => `
        <button class="indoor-fl-btn ${fl.floor === activeIndoorFloor ? "active" : ""}" onclick="activateIndoorOverlay('${escapeHtml(activeIndoorKey)}','${escapeHtml(fl.floor)}',true)">${escapeHtml(fl.floor)}</button>
      `).join("")}
      <button class="indoor-act-btn" title="放大看完整圖例" onclick="openFloorPlanModal('${escapeHtml(activeIndoorKey)}','${escapeHtml(activeIndoorKey)}')">🔍</button>
      <button class="indoor-act-btn close" title="關閉室內圖" onclick="closeIndoorOverlay()">✕</button>
    `;
    bar.classList.add("show");
    return;
  }

  // 未開啟套疊時：若使用者手動放大到 zoom >= 18 且畫面中心位於支援室內圖的館舍內，顯示一鍵浮動提示鈕
  const z = map.getZoom();
  if (z >= 18) {
    const c = map.getCenter();
    const nearKey = Object.keys(FLOORPLANS_DATA).find(k => {
      const entry = FLOORPLANS_DATA[k];
      if (!entry.center || !(entry.floors || []).some(fl => fl.overlay && fl.bounds)) return false;
      return haversineMeters(c.lat, c.lng, entry.center[0], entry.center[1]) <= 95;
    });
    if (nearKey) {
      const defFl = FLOORPLANS_DATA[nearKey].default_floor || "1F";
      bar.innerHTML = `<button class="indoor-hint-pill" onclick="activateIndoorOverlay('${escapeHtml(nearKey)}','${escapeHtml(defFl)}',true)">🗺️ 套疊${escapeHtml(nearKey)}平面圖</button>`;
      bar.classList.add("show");
      return;
    }
  }
  bar.classList.remove("show");
  bar.innerHTML = "";
}

function syncIndoorOverlayOnMove() {
  if (activeIndoorKey && map.getZoom() < 16) {
    closeIndoorOverlay(true);
    return;
  }
  renderIndoorBar();
}

function toggleRateForm() {

  if (open) box.scrollIntoView({ behavior: "smooth", block: "nearest" });

function addCustomTag() {
  const input = document.getElementById("inCustomTag");
  if (!input) return;
  const val = input.value.replace(/[|\r\n]/g, "").trim().slice(0, 10);
  if (!val) return;
  const grid = document.getElementById("tagGrid");
  const existing = Array.from(grid.querySelectorAll(".tag-opt")).find(el => el.dataset.tag === val);
  if (existing) {
    existing.classList.add("selected");
    input.value = "";
    return;
  }
  const customCount = grid.querySelectorAll(".tag-opt[data-custom='1']").length;
  if (customCount >= 3) {
    showToast("單則評論最多可自訂 3 個標籤喔！");
    return;
  }
  const span = document.createElement("span");
  span.className = "tag-opt selected";
  span.dataset.tag = val;
  span.dataset.custom = "1";
  span.textContent = val;
  span.onclick = () => span.classList.toggle("selected");
  grid.appendChild(span);
  input.value = "";
}

function setStars(val) {
  const picker = document.getElementById("starPicker");
  picker.dataset.val = val;
  Array.from(picker.children).forEach((btn, idx) => {
    btn.classList.toggle("lit", idx < val);
  });
  // Sync sub-scores default to overall star rating
  document.getElementById("inClean").value = val;
  document.getElementById("inVent").value = val;
  document.getElementById("inEquip").value = val;
}

// Client-side Photo Compression (max 900px JPEG ~70-110KB so mobile uploads are fast & free)
let pickedPhotos = { rev: "", newpt: "" };

function handlePhotoPick(input, slot) {
  const file = input.files && input.files[0];
  if (!file) return;
  showToast("正在壓縮處理照片...");
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = img.width > maxW ? (maxW / img.width) : 1;
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      pickedPhotos[slot] = dataUrl;
      const wrap = document.getElementById(slot + "PhotoPreviewWrap");
      const preview = document.getElementById(slot + "PhotoPreviewImg");
      if (wrap && preview) {
        preview.src = dataUrl;
        wrap.style.display = "block";
      }
      showToast("照片已就緒！");
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function clearPickedPhoto(slot) {
  pickedPhotos[slot] = "";
  const wrap = document.getElementById(slot + "PhotoPreviewWrap");
  if (wrap) wrap.style.display = "none";
}

function submitReview(fid) {
  const btn = document.getElementById("submitRevBtn");
  btn.disabled = true;
  const floor = (document.getElementById("inFloor")?.value || "1F").trim();
  const clean = Number(document.getElementById("inClean").value);
  const vent  = Number(document.getElementById("inVent").value);
  const equip = Number(document.getElementById("inEquip").value);
  const comment = document.getElementById("inComment").value.trim();
  const author = document.getElementById("inAuthor").value.trim() || "匿名臺大人";
  const photo_data = pickedPhotos.rev || "";
  const photo_source = (document.getElementById("inPhotoSource")?.value || "").trim() || (author !== "匿名臺大人" ? `${author} 實拍` : "臺大師生實拍");
  const tags = Array.from(document.querySelectorAll("#tagGrid .tag-opt.selected")).map(el => el.dataset.tag);

  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const rec = {
    author, floor, clean, vent, equip, tags,
    photo_url: photo_data,
    photo_source: photo_data ? photo_source : "",
    comment: comment || (tags.length ? tags.join("、") : (photo_data ? "分享實景照片" : `${Math.round((clean+vent+equip)/3)}★ 評分`)),
    time: timeStr
  };

  if (photo_data) {
    // 含照片者改先送後台審核，不直接寫入本機公開畫面，並給予友善提示
    pickedPhotos.rev = "";
    pushToCloud({
      action: "addReview",
      feature_id: fid,
      review: Object.assign({}, rec, { photo_base64: photo_data, photo_url: "" })
    });
    openPointSheet(fid, false);
    showToast("已送出！含照片的評論將於確認無隱私疑慮後公開顯示");
    return;
  }

  if (!reviewsMap[fid]) reviewsMap[fid] = [];
  reviewsMap[fid].push(rec);
  pickedPhotos.rev = "";
  saveLocal();
  pushToCloud({
    action: "addReview",
    feature_id: fid,
    review: Object.assign({}, rec, { photo_base64: "", photo_url: "" })
  });

  renderPoints();
  openPointSheet(fid, false);
  showToast("感謝貢獻！你的評分已更新到地圖");
}

// Live GPS Tracking (Google Maps Blue Pulsing Dot + Accuracy Circle)
let userMarker = null;
let userAccuracyCircle = null;
let gpsWatchId = null;
let lastUserPos = null;
let hasCenteredOnGps = false;

const userDotIcon = L.divIcon({
  className: "",
  html: '<div class="user-dot-wrap"><div class="user-dot-pulse"></div><div class="user-dot-core"></div></div>',
  iconSize: [20, 20],
  iconAnchor: [10, 10]
});

function updateUserLocationOnMap(lat, lon, accuracy, flyToUser = false) {
  lastUserPos = { lat, lon, accuracy };
  if (!userMarker) {
    userMarker = L.marker([lat, lon], { icon: userDotIcon, zIndexOffset: 1000 }).addTo(map).bindTooltip("你的目前位置");
  } else {
    userMarker.setLatLng([lat, lon]);
  }
  if (!userAccuracyCircle) {
    userAccuracyCircle = L.circle([lat, lon], {
      radius: Math.min(accuracy || 25, 120),
      color: "#2563eb", fillColor: "#3b82f6", fillOpacity: 0.14, weight: 1
    }).addTo(map);
  } else {
    userAccuracyCircle.setLatLng([lat, lon]);
    userAccuracyCircle.setRadius(Math.min(accuracy || 25, 120));
  }
  if (flyToUser) {
    map.flyTo([lat, lon], Math.max(map.getZoom(), 17));
  }
}

function toggleGpsTracking() {
  if (!navigator.geolocation) { showToast("此瀏覽器不支援 GPS 定位"); return; }
  const fab = document.getElementById("gpsFab");

  if (gpsWatchId !== null) {
    // Already tracking: re-center on user; long-turn off if already centered close by
    if (lastUserPos) {
      map.flyTo([lastUserPos.lat, lastUserPos.lon], 17);
      showToast(`已定位至目前位置（誤差約 ${Math.round(lastUserPos.accuracy || 15)} m）`);
    }
    return;
  }

  fab.classList.add("tracking");
  hasCenteredOnGps = false;
  showToast("正在開啟即時 GPS 定位...");

  gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const shouldFly = !hasCenteredOnGps;
      hasCenteredOnGps = true;
      updateUserLocationOnMap(latitude, longitude, accuracy, shouldFly);
    },
    (err) => {
      fab.classList.remove("tracking");
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      showToast("無法取得定位，請允許瀏覽器存取位置權限");
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function markMyGps() {
  if (lastUserPos) {
    openAddPointSheet(lastUserPos.lat, lastUserPos.lon);
    return;
  }
  if (!navigator.geolocation) { showToast("此瀏覽器不支援 GPS 定位"); return; }
  showToast("正在抓取你的 GPS 座標...");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      updateUserLocationOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, true);
      openAddPointSheet(pos.coords.latitude, pos.coords.longitude);
    },
    () => showToast("無法取得定位，請改點地圖或「畫面中心」"),
    { enableHighAccuracy: true, timeout: 12000 }
  );
}

// Nearby Restrooms Sheet (Mobile GPS 1-Tap)
function renderNearbyList(uLat, uLon) {
  const ranked = getAllFeatures().map(f => {
    const [lon, lat] = f.geometry.coordinates;
    return { feat: f, dist: map.distance([uLat, uLon], [lat, lon]) };
  }).sort((a, b) => a.dist - b.dist).slice(0, 5);

  const listHtml = ranked.map(item => {
    const p = item.feat.properties;
    const st = getStats(p.feature_id);
    const starTxt = st.count ? `★ ${st.avg.toFixed(1)}` : "尚無評分";
    const walkMin = Math.max(1, Math.round(item.dist / 75));
    return `
      <div class="nearby-item" onclick="openPointSheet('${p.feature_id}')">
        <div>
          <div style="font-weight:700;color:#1e3a5f;font-size:14px;">${escapeHtml(p.name)}</div>
          <div style="font-size:12px;color:#64748b;">${escapeHtml(p.category)}｜${starTxt}｜步行 ~${walkMin} 分</div>
        </div>
        <span class="dist-pill">${Math.round(item.dist)} m</span>
      </div>
    `;
  }).join("");

  openSheet("離你最近的 5 間廁所", `<div style="font-size:12.5px;color:#475569;margin-bottom:10px;">點選任一間即可導航或 10 秒快評：</div>` + listHtml);
}

function openNearbySheet() {

}

function submitNewPoint(lat, lon) {
  const name = document.getElementById("newName").value.trim();
  if (!name) { showToast("請輸入館舍與廁所名稱！"); return; }
  const category = document.getElementById("newCat").value;
  const floor = document.getElementById("newFloor")?.value || "1F";
  const floorGrp = getFloorGroup(floor) || "一樓";
  const description = document.getElementById("newDesc").value.trim();
  const author = document.getElementById("newAuthor").value.trim() || "匿名臺大人";
  const photo_data = pickedPhotos.newpt || "";
  const photo_source = photo_data ? (author !== "匿名臺大人" ? `${author} 實拍` : "臺大師生實拍") : "";
  const fid = "vgi_" + Date.now();

  const newFeat = {
    type: "Feature",
    geometry: { type: "Point", coordinates: [Number(lon.toFixed(6)), Number(lat.toFixed(6))] },
    properties: {
      feature_id: fid, category, campus: "參與式新增", name, floor,
      description: `【${floorGrp}】${description}（由 ${author} 共編新增）`,
      is_24h: description.includes("24小時") || description.includes("24H") ? "是" : "否",
      source: "PPGIS_User", photo_file: "",
      photo_url: photo_data, photo_source
    }
  };
  userPoints.push(newFeat);
  pickedPhotos.newpt = "";
  saveLocal();
  pushToCloud({
    action: "addPoint",
    feature: newFeat,
    photo_base64: photo_data
  });
  toggleAddMode(false);
  renderPoints();
  openPointSheet(fid);
  showToast("已新增到地圖！歡迎接著給它第一個評分");
}

// Leaderboard Sheet (好評排行榜：綜合 Top 10 / 免治專區 / 最多評論)
function openLeaderboardSheet(tab = "top") {
  const enriched = getAllFeatures().map(f => {
    const p = f.properties;
    const st = getStats(p.feature_id);
    return { feat: f, p, st };
  });

  let list = [];
  if (tab === "top") {
    list = enriched.filter(x => x.st.count > 0)
      .sort((a, b) => (b.st.avg - a.st.avg) || (b.st.count - a.st.count))
      .slice(0, 10);
  } else if (tab === "bidet") {
    list = enriched.filter(x => x.st.tagCounts["有免治馬桶"] > 0)
      .sort((a, b) => (b.st.tagCounts["有免治馬桶"] - a.st.tagCounts["有免治馬桶"]) || (b.st.avg - a.st.avg))
      .slice(0, 15);
  } else {
    list = enriched.filter(x => x.st.count > 0)
      .sort((a, b) => (b.st.count - a.st.count) || (b.st.avg - a.st.avg))
      .slice(0, 10);
  }

  const tabsHtml = `
    <div class="floor-tabs" style="margin-top:0;margin-bottom:10px;">
      <button class="floor-tab ${tab==='top'?'active':''}" onclick="openLeaderboardSheet('top')">綜合 Top 10</button>

    </div>
  `;

  const itemsHtml = list.length === 0
    ? `<div style="padding:18px 8px;text-align:center;color:#64748b;font-size:13px;">這個分類還沒有上榜資料，快回地圖幫你喜歡的廁所評分吧！</div>`
    : list.map((item, idx) => {
        const rank = idx + 1;
        const rCls = rank === 1 ? "rank-1" : (rank === 2 ? "rank-2" : (rank === 3 ? "rank-3" : ""));
        const topTags = Object.entries(item.st.tagCounts)
          .sort((a, b) => b[1] - a[1]).slice(0, 2)
          .map(([t]) => `<span class="tag-pill" style="font-size:10px;padding:1px 6px;">${escapeHtml(t)}</span>`).join(" ");
        return `
          <div class="rank-item" onclick="flyAndOpenPoint('${item.p.feature_id}')">
            <div class="rank-num ${rCls}">${rank}</div>
            <div style="min-width:0;flex:1;">
              <div style="font-weight:800;color:#1e3a5f;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.p.name)}</div>
              <div style="font-size:11.5px;color:#64748b;margin-top:2px;">${escapeHtml(item.p.category)} ${topTags}</div>
            </div>

              <div style="font-size:10.5px;color:#64748b;">${item.st.count} 則</div>
            </div>
          </div>
        `;
      }).join("");

  const footerHtml = `<div style="margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:10px;font-size:12px;color:#475569;text-align:center;">沒看到你的私房好廁所？點地圖上的館舍幫它評分上榜！</div>`;
  openSheet("🏆 臺大廁所好評排行榜", tabsHtml + itemsHtml + footerHtml);
}

function exportVGI(fmt) {
  const all = getAllFeatures().map(f => {
    const p = Object.assign({}, f.properties);
    const st = getStats(p.feature_id);
    p.rating_count = st.count;
    p.rating_avg = st.count ? Number(st.avg.toFixed(2)) : null;
    p.clean_avg  = st.count ? Number(st.clean.toFixed(2)) : null;
    p.vent_avg   = st.count ? Number(st.vent.toFixed(2)) : null;
    p.equip_avg  = st.count ? Number(st.equip.toFixed(2)) : null;
    p.crowd_tags = Object.keys(st.tagCounts).join(";");
    p.latest_comment = (reviewsMap[p.feature_id] || []).slice(-1)[0]?.comment || "";
    return { type: "Feature", geometry: f.geometry, properties: p };
  });
  let blob, filename;
  if (fmt === "geojson") {
    blob = new Blob([JSON.stringify({ type: "FeatureCollection", name: "NTU_Restrooms_PPGIS", features: all }, null, 2)], { type: "application/geo+json;charset=utf-8" });
    filename = "台大廁所_參與式評分資料.geojson";
  } else {
    const cols = ["feature_id","category","campus","name","lat","lon","rating_count","rating_avg","clean_avg","vent_avg","equip_avg","crowd_tags","latest_comment"];
    const lines = [cols.join(",")];
    all.forEach(f => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      lines.push([p.feature_id, p.category, p.campus, p.name, lat, lon, p.rating_count, p.rating_avg ?? "", p.clean_avg ?? "", p.vent_avg ?? "", p.equip_avg ?? "", p.crowd_tags, p.latest_comment].map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(","));
    });
    blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    filename = "台大廁所_參與式評分資料.csv";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

    const starTxt = st.count ? `★ ${st.avg.toFixed(1)}` : p.category;
    return `
      <div class="search-dd-item" onclick="pickSearchResult('${p.feature_id}')">
        <div style="min-width:0;">
          <div class="search-dd-name">${escapeHtml(p.name)}</div>
          <div class="search-dd-sub">${escapeHtml(p.campus || "")}｜${escapeHtml(p.category)}</div>
        </div>
        <span style="font-size:12px;font-weight:700;color:#d97706;white-space:nowrap;">${starTxt}</span>
      </div>
    `;
  }).join("");
  searchDropdown.style.display = "block";
}

function pickSearchResult(fid) {
  searchDropdown.style.display = "none";
  flyAndOpenPoint(fid);
}

searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  document.getElementById("clearSearchBtn").style.display = searchQuery ? "inline-flex" : "none";
  renderPoints();
  renderSearchDropdown();
});
searchInput.addEventListener("focus", () => {
  if (searchQuery) renderSearchDropdown();
});
map.on("click", () => {
  searchDropdown.style.display = "none";
});

function clearSearch() {
  searchInput.value = "";
  searchQuery = "";
  document.getElementById("clearSearchBtn").style.display = "none";
  searchDropdown.style.display = "none";
  renderPoints();
}

// Lightweight Lazy-Loaded Floor Plan Modal (0 memory overhead until user opens it)
function findFloorPlanKey(nameStr) {
  const s = String(nameStr || "");
  for (const [key, cfg] of Object.entries(FLOORPLANS_DATA || {})) {
    const excludes = cfg.exclude || [];
    if (excludes.some(ex => s.includes(ex))) continue;
    const matches = cfg.match || [key];
    if (matches.some(m => s.includes(m))) return key;
  }
  return "";
}

function openFloorPlanModal(bldgKey, floorIdx = 0) {
  const cfg = FLOORPLANS_DATA[bldgKey];
  if (!cfg || !cfg.floors || !cfg.floors.length) return;
  const f = cfg.floors[floorIdx] || cfg.floors[0];
  document.getElementById("fpTitle").textContent = `${bldgKey} — 樓層平面與配置`;
  document.getElementById("fpTabs").innerHTML = cfg.floors.map((fl, i) =>
    `<button class="fp-tab ${i === floorIdx ? 'active' : ''}" onclick="openFloorPlanModal('${escapeHtml(bldgKey)}', ${i})">${escapeHtml(fl.floor)}</button>`
  ).join("");

  const imgBox = document.getElementById("fpImgContainer");
  if (f.img) {
    const credit = cfg.source || "臺大公開資料";
    imgBox.innerHTML = `
      <div class="fp-img-box">
        <img id="fpActiveImg" src="${escapeHtml(f.img)}" loading="lazy" alt="${escapeHtml(bldgKey)} ${escapeHtml(f.floor)} 平面圖" onclick="openLightbox('${escapeHtml(f.img)}', '${escapeHtml(credit)}')" />
        <span class="photo-credit">來源：${escapeHtml(credit)}</span>
      </div>
      <div style="font-size:11px;color:#64748b;text-align:center;margin-top:4px;">點擊平面圖可全螢幕放大檢視</div>
    `;
  } else {
    imgBox.innerHTML = `<div style="padding:16px 12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;text-align:center;font-size:12.5px;color:#64748b;">此樓層尚無平面圖檔，歡迎拍電梯旁逃生平面圖透過評論投稿補齊！</div>`;
  }
  document.getElementById("fpDesc").textContent = f.desc || "";
  document.getElementById("fpModal").style.display = "flex";
}

function closeFloorPlanModal() {
  document.getElementById("fpModal").style.display = "none";
  // Free image memory immediately on mobile devices
  document.getElementById("fpImgContainer").innerHTML = "";
}

// First-visit Illustrated Guide Modal
const LS_GUIDE_KEY = "ntu_ppgis_guide_seen_v1";
function openGuideModal() {
  document.getElementById("guideModal").style.display = "flex";
}
function closeGuideModal() {
  if (document.getElementById("guideDontShow")?.checked) {
    localStorage.setItem(LS_GUIDE_KEY, "1");
  }
  document.getElementById("guideModal").style.display = "none";
}

// Init + Handle Deep Links (?id=... or ?q=...)
renderPoints();
syncFromCloud();

const params = new URLSearchParams(location.search);
if (params.get("q")) {
  searchInput.value = params.get("q");
  searchQuery = params.get("q").trim().toLowerCase();
  document.getElementById("clearSearchBtn").style.display = "inline-flex";
  renderPoints();
}
if (params.get("id")) {
  setTimeout(() => openPointSheet(params.get("id")), 300);
} else if (!localStorage.getItem(LS_GUIDE_KEY)) {
  setTimeout(() => openGuideModal(), 350);
}
</script>
